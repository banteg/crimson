<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play · crimson.land</title>
<!-- The site's font, colors and game buttons (service/public/game.css). -->
<link rel="stylesheet" href="/game.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a07; color: var(--text);
    font: 16px/20px "Crimson Small", Arial, sans-serif; -webkit-font-smoothing: none; }
  canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  #cover { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 16px; background: #0b0a07; }
  #cover img { width: min(512px, 90vw); filter: drop-shadow(7px 7px 0 rgb(0 0 0 / 0.267)); }
  #status { min-height: 20px; color: var(--label); }
  #progress { width: min(360px, 80vw); height: 4px; background: rgb(255 255 255 / 0.1); }
  #progress div { height: 100%; width: 0; background: var(--row-on); transition: width 0.1s linear; }
  #touch { max-width: 420px; color: var(--dim); }
  .buttons { justify-content: center; }
  .button input { display: none; }
  /* Focus shows as the game's hover fill. */
  .button:focus-visible { outline: none; color: #fff; }
  .button:focus-visible::before { opacity: 1; }
  /* Fullscreen and back to the site, in the top corners: shown while the cursor is near them, and briefly once the game
     starts. */
  .corner { position: fixed; top: 6px; width: 32px; height: 32px; padding: 6px; border: 0; border-radius: 4px; box-sizing: border-box;
    background: rgb(11 10 7 / 0.6); color: rgb(255 255 255 / 0.7); cursor: pointer; transition: opacity 0.3s; opacity: 0; pointer-events: none; }
  .corner.shown { opacity: 1; pointer-events: auto; }
  .corner:hover { color: #fff; }
  .corner svg { display: block; width: 20px; height: 20px; }
  #fullscreen { right: 6px; }
  #home { left: 6px; }
  #fullscreen .exit, :fullscreen #fullscreen .enter { display: none; }
  :fullscreen #fullscreen .exit { display: block; }
  #share { position: fixed; top: 6px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 4px; background: rgb(11 10 7 / 0.72); color: var(--label); opacity: 0; pointer-events: none;
    transition: opacity 0.3s; }
  #share.shown, #share:focus-within { opacity: 1; pointer-events: auto; }
  #share button, #share a { border: 0; padding: 2px 6px; border-radius: 3px; background: rgb(255 255 255 / 0.08);
    color: var(--text); font: inherit; text-decoration: none; cursor: pointer; }
  #share button:hover, #share a:hover { color: #fff; background: rgb(255 255 255 / 0.16); }
  #share input { width: 72px; padding: 1px 5px; border: 1px solid rgb(255 255 255 / 0.2); border-radius: 3px;
    background: #0b0a07; color: var(--text); font: inherit; }
  #notice { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); padding: 4px 12px; border-radius: 4px;
    background: rgb(11 10 7 / 0.8); color: rgb(250 160 80); }
  #share:not([hidden]) ~ #notice { top: 42px; }
  #notice a { color: var(--row-on); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="cover">
  <img src="/ui/sign.png" alt="Crimsonland" onerror="this.hidden = true">
  <div id="status">Loading…</div>
  <div id="progress" hidden><div></div></div>
  <div id="offer" class="buttons" hidden>
    <button id="retry" type="button" class="button"><span>Retry</span></button>
    <label class="button wide"><span>Choose folder</span><input id="folder" type="file" webkitdirectory></label>
  </div>
  <div id="ready" class="buttons" hidden><button id="play" type="button" class="button"><span>Play</span></button></div>
  <div id="elsewhere" class="buttons" hidden><button id="here" type="button" class="button wide"><span>Play here</span></button></div>
  <div id="again" class="buttons" hidden>
    <button type="button" class="button wide" onclick="location.reload()"><span>Play again</span></button>
    <a class="button wide" href="/"><span>crimson.land</span></a>
  </div>
  <div id="outside" class="buttons" hidden><a class="button wide"><span>Open on crimson.land</span></a></div>
  <p id="touch" hidden>On a phone, Crimsonland plays with a gamepad: connect one to play.</p>
</div>
<a id="home" class="corner shown" href="/" title="crimson.land" aria-label="Back to crimson.land">
  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4l-6 6 6 6"/></svg>
</a>
<button id="fullscreen" class="corner" type="button" title="Fullscreen" aria-label="Fullscreen" hidden>
  <svg class="enter" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 7V2h5M13 2h5v5M18 13v5h-5M7 18H2v-5"/></svg>
  <svg class="exit" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 2v5H2M18 7h-5V2M13 18v-5h5M2 13h5v5"/></svg>
</button>
<div id="share" hidden>
  <button id="share-copy" type="button">Share from here</button>
  <label>stop <input id="share-stop" type="text" inputmode="numeric" placeholder="end tick"></label>
  <a id="share-full" href="#" hidden>Full run</a>
</div>
<div id="notice" hidden></div>
<script>
  // The game reads and writes its directory, /game, kept in IndexedDB. Files it
  // lacks come from ?assets=<url>, default ./game/ (the project's distribution:
  // crimson.paq, sfx.paq and music.paq), or else from the player's own game
  // folder, whose grim.dll comes along (game/resources.cpp).
  const FILES = ["crimson.paq", "sfx.paq"];
  const ART_VERSION = /* ASSET_VERSION */ null;
  const artHash = async (bytes) => Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", bytes)),
    (byte) => byte.toString(16).padStart(2, "0")).join("");
  // Without music.paq, the loose music the GOG release ships: what the executable
  // plays by name, and the file naming the in-game tunes.
  const MUSIC = ["intro", "crimson_theme", "crimsonquest", "shortie_monk"].map((name) => `music/${name}.ogg`);
  const TUNES = "music/game_tunes.txt";
  const base = new URLSearchParams(location.search).get("assets") ?? "game/";
  const status = document.getElementById("status");
  const progress = document.getElementById("progress");
  const cover = document.getElementById("cover");
  const canvas = document.getElementById("canvas");
  const say = (text) => (status.textContent = text);
  // A link to a run (crimson.land/play/?watch=<run>, from its page or an X post's
  // player card): the cover names the run and offers Watch, and its replay plays
  // once the game is up, which skips the intro (host/watch.inc), then returns to
  // the high scores.
  const query = new URLSearchParams(location.search);
  const linked = query.get("watch");
  const linkedQuest = query.get("quest");
  const parseTick = (value) => {
    if (value === null) return null;
    return /^[1-9]\d{0,8}$/.test(value) ? Number(value) : NaN;
  };
  const linkTick = parseTick(query.get("tick")), linkStop = parseTick(query.get("stop"));
  // Inside another page (that player card), the site opens in a new tab and the
  // game plays on.
  const framed = window.self !== window.top;
  if (framed) for (const link of document.querySelectorAll("a")) link.target = "_blank";
  // Where the frame cannot keep the game (its storage refused, say), the page
  // opens on its own.
  const outside = document.getElementById("outside");
  outside.firstElementChild.href = location.href;
  const stuck = (text) => {
    say(text);
    outside.hidden = !framed;
  };
  // The right button is the game's (reload, by default), not the browser's menu.
  canvas.addEventListener("contextmenu", (event) => event.preventDefault());
  // Watching needs no controls.
  if (!linked && matchMedia("(pointer: coarse)").matches && !matchMedia("(any-pointer: fine)").matches)
    document.getElementById("touch").hidden = false;

  // A button released while the page was away never reaches SDL, which then
  // drops the next press as a repeat. The first mouse event back carries the
  // real buttons: SDL hears a release (on the document, where it listens for
  // them) for each one that is up or about to be pressed, before the event.
  let away = false;
  addEventListener("blur", () => (away = true));
  for (const type of ["pointermove", "pointerdown"])
    addEventListener(type, (event) => {
      if (!away || !event.isTrusted || event.pointerType !== "mouse") return;
      away = false;
      // MouseEvent.button to its MouseEvent.buttons bit: left, middle, right, back, forward.
      const bit = (button) => 1 << [0, 2, 1, 3, 4][button];
      // A press, also one chorded onto a held button (a pointermove), names its button.
      const pressing = event.button >= 0 && event.buttons & bit(event.button);
      const held = pressing ? event.buttons & ~bit(event.button) : event.buttons;
      for (const button of [0, 1, 2, 3, 4])
        if (!(held & bit(button)))
          document.dispatchEvent(new PointerEvent("pointerup", {
            pointerType: "mouse", pointerId: event.pointerId, button, buttons: held,
            clientX: event.clientX, clientY: event.clientY,
          }));
    }, true);

  // Fullscreen shows while the cursor is near its corner. It keeps Escape for the
  // game where the browser allows it (the Keyboard Lock API); holding Escape
  // still leaves.
  const fullscreen = document.getElementById("fullscreen"), home = document.getElementById("home");
  const share = document.getElementById("share"), shareStop = document.getElementById("share-stop"),
    shareFull = document.getElementById("share-full");
  let hide;
  // The ticks of the board run playing (Module.watching), and the stop its
  // playback was last given, which it drops on reaching.
  let watchTicks = 0, givenStop = null;
  const showFullscreen = (ms) => {
    fullscreen.classList.add("shown");
    home.classList.add("shown");
    share.classList.add("shown");
    clearTimeout(hide);
    hide = setTimeout(
      () => cover.hidden && (fullscreen.classList.remove("shown"), home.classList.remove("shown"), share.classList.remove("shown")),
      ms,
    );
  };
  // Leaving mid-game quits it first, as closing the game does, and goes once a
  // run's replay and the exit's saves reach IndexedDB; else the quit screen says
  // why. A second click leaves regardless.
  let leaving = false;
  home.onclick = (event) => {
    if (framed || !cover.hidden || leaving) return;
    event.preventDefault();
    leaving = true;
    Module.ccall("client_close", null, [], []);
  };
  // While a board run plays, the whole top edge brings the share bar.
  addEventListener(
    "pointermove",
    (event) => event.clientY < 80 && (!share.hidden || event.clientX > innerWidth - 80 || event.clientX < 80) && showFullscreen(1500),
  );
  for (const type of ["keydown", "keyup", "keypress"])
    shareStop.addEventListener(type, (event) => event.stopPropagation(), true);
  shareFull.onclick = (event) => {
    event.preventDefault();
    const run = Module.ccall("client_watch_run", "string", [], []);
    if (!run) return;
    Module.ccall("client_watch_moment", "string", ["number", "number"], [1, 0]);
    shareStop.value = "";
    givenStop = null;
    shareFull.hidden = true;
    history.replaceState(null, "", `?watch=${encodeURIComponent(run)}`);
    canvas.focus();
  };
  document.getElementById("share-copy").onclick = async () => {
    const run = Module.ccall("client_watch_run", "string", [], []);
    const tick = Module.ccall("client_watch_tick", "number", [], []);
    if (!run || !tick) return;
    const rawStop = shareStop.value.trim();
    let stop = rawStop ? parseTick(rawStop) : null;
    // A stop playback already reached is done with.
    if (stop !== null && stop === givenStop && stop <= tick) (stop = null), (shareStop.value = "");
    if (Number.isNaN(stop) || Module.ccall("client_watch_moment", "string", ["number", "number"], [0, stop ?? 0]))
      return tell(`Stop tick must be between ${tick + 1} and ${watchTicks}.`);
    givenStop = stop;
    const url = new URL(location.href);
    url.search = "";
    url.searchParams.set("watch", run);
    url.searchParams.set("tick", String(tick));
    if (stop !== null) url.searchParams.set("stop", String(stop));
    history.replaceState(null, "", url.search);
    shareFull.href = `?watch=${encodeURIComponent(run)}`;
    shareFull.hidden = false;
    const copied = await navigator.clipboard?.writeText?.(url.href).then(() => true, () => false);
    tell(copied ? "Copied link to this moment" : "Link to this moment", url.href);
    canvas.focus();
  };
  fullscreen.onclick = async () => {
    if (document.fullscreenElement) return document.exitFullscreen();
    await document.documentElement.requestFullscreen();
    await navigator.keyboard?.lock?.(["Escape"]).catch(() => {});
    canvas.focus();
  };
  // A failed save stays on screen until a save succeeds; the game plays on.
  // Other notes (tell) keep their own time.
  const notice = document.getElementById("notice");
  let unsaved = false;
  const saveFailed = (error) => {
    notice.textContent = "Could not save: " + (error.message ?? error);
    notice.hidden = false;
    unsaved = true;
  };

  // Writes /game back to IndexedDB, one sync at a time and only once it has been
  // read, and not once another tab has taken the game: IndexedDB takes the
  // written tree as the whole directory. Resolves whether the saves committed.
  let hydrated = false, moved = false, syncing = null, again = false;
  function persist() {
    if (!hydrated || moved) return Promise.resolve(false);
    if (syncing) {
      again = true;
      return syncing;
    }
    syncing = new Promise((resolve) => FS.syncfs(false, (error) => {
      if (error) saveFailed(error);
      else if (unsaved) {
        unsaved = false;
        notice.hidden = true;
      }
      resolve(!error);
    })).then((ok) => {
      syncing = null;
      if (!again) return ok;
      again = false;
      return persist();
    });
    return syncing;
  }

  const store = (name, bytes) => {
    FS.mkdirTree("/game/" + name.slice(0, name.lastIndexOf("/") + 1));
    FS.writeFile("/game/" + name, bytes);
  };
  const exists = (name) => FS.analyzePath("/game/" + name).exists;
  // The game files /game lacks, the tunes game_tunes.txt adds among them.
  function missing() {
    if (exists("music.paq")) return FILES.filter((name) => !exists(name));
    const tunes = exists(TUNES)
      ? [...FS.readFile("/game/" + TUNES, { encoding: "utf8" }).matchAll(/^snd_addGameTune\s+(\S+)/gm)].map((m) => "music/" + m[1])
      : [TUNES];
    return [...FILES, ...MUSIC, ...tunes].filter((name) => !exists(name));
  }

  // A PAQ's entries: a NUL-terminated name, a little-endian size, the bytes.
  function paq(bytes) {
    const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    // "paq\0" as a number: the minified page would hold a raw NUL, which HTML replaces.
    if (bytes.length < 4 || view.getUint32(0) !== 0x70617100) throw Error("not a PAQ");
    const entries = [];
    for (let at = 4; at < bytes.length; ) {
      const end = bytes.indexOf(0, at);
      if (end < 0 || end + 5 > bytes.length) throw Error("truncated PAQ");
      const size = view.getUint32(end + 1, true);
      if (end + 5 + size > bytes.length) throw Error("truncated PAQ");
      entries.push([new TextDecoder("latin1").decode(bytes.subarray(at, end)), bytes.subarray(end + 5, end + 5 + size)]);
      at = end + 5 + size;
    }
    return entries;
  }
  // The executable's own pack lookup finds music.paq's entries by their whole
  // names, music\intro.ogg and the rest; an earlier repack stored intro.ogg and
  // music/game_tunes.txt, renamed here as the Python game does
  // (src/crimson/assets_fetch.py).
  const storeMusic = (bytes) => {
    const entries = paq(bytes).map(([name, data]) => [new TextEncoder().encode("music\\" + name.split(/[\\/]/).pop()), data]);
    const out = new Uint8Array(entries.reduce((sum, [name, data]) => sum + name.length + 5 + data.length, 4));
    const view = new DataView(out.buffer);
    view.setUint32(0, 0x70617100);
    entries.reduce((at, [name, data]) => {
      out.set(name, at);
      view.setUint32(at + name.length + 1, data.length, true);
      out.set(data, at + name.length + 5);
      return at + name.length + 5 + data.length;
    }, 4);
    store("music.paq", out);
  };

  // The files the player picks, matched by name inside the chosen folder: the
  // GOG release's (music as loose files) or the project's (music.paq), over
  // whatever a failed download left. The directory must then be complete.
  // Resolves "retry", or "picked" once a folder completes the directory.
  function offer() {
    const buttons = document.getElementById("offer");
    buttons.hidden = false;
    progress.hidden = true;
    say("The game files did not download. Try again, or play from your own Crimsonland folder.");
    return new Promise((resolve) => {
      document.getElementById("retry").onclick = () => {
        buttons.hidden = true;
        resolve("retry");
      };
      document.getElementById("folder").onchange = async (event) => {
        const files = new Map(
          [...event.target.files].map((f) => [f.webkitRelativePath.split("/").slice(1).join("/").toLowerCase(), f]),
        );
        try {
          for (const [name, file] of files)
            if (FILES.includes(name) || name === "grim.dll" || name.startsWith("music/")) store(name, new Uint8Array(await file.arrayBuffer()));
          if (files.has("music.paq")) storeMusic(new Uint8Array(await files.get("music.paq").arrayBuffer()));
        } catch (error) {
          return say("Could not read that folder: " + (error.message ?? error));
        }
        // Nothing reaches IndexedDB until the directory is complete.
        const lacking = missing(), named = lacking.filter((name) => !name.startsWith("music/"));
        const music = lacking.length - named.length;
        if (lacking.length) return say(`That folder lacks ${[...named, ...(music ? [`${music} music files`] : [])].join(", ")}.`);
        buttons.hidden = true;
        resolve("picked");
      };
    });
  }

  // Downloads, with their progress across every file still to come.
  async function download(names) {
    const responses = await Promise.all(names.map((name) => {
      const url = new URL(name, new URL(base, location.href));
      if (name === "crimson.paq") url.searchParams.set("sha256", ART_VERSION.current);
      return fetch(url);
    }));
    const failed = responses.find((response) => !response.ok);
    if (failed) throw Error(failed.url + ": " + failed.status);
    const total = responses.reduce((sum, response) => sum + Number(response.headers.get("content-length") ?? 0), 0);
    let received = 0;
    progress.hidden = false;
    return Promise.all(responses.map(async (response, i) => {
      const chunks = [];
      for (const reader = response.body.getReader(); ; ) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        if (total) progress.firstElementChild.style.width = (100 * Math.min(received / total, 1)) + "%";
        const mb = (bytes) => (bytes / 1048576).toFixed(1);
        say(`Downloading the game: ${total ? `${mb(received)} of ${mb(total)}` : mb(received)} MB`);
      }
      const bytes = new Uint8Array(chunks.reduce((sum, chunk) => sum + chunk.length, 0));
      chunks.reduce((at, chunk) => (bytes.set(chunk, at), at + chunk.length), 0);
      if (names[i] === "crimson.paq" && await artHash(bytes) !== ART_VERSION.current)
        throw Error("Downloaded game art has an unexpected hash");
      return bytes;
    }));
  }

  async function fetchMissing() {
    const needed = missing();
    if (exists("crimson.paq") && ART_VERSION.previous.includes(await artHash(FS.readFile("/game/crimson.paq"))))
      needed.push("crimson.paq");
    if (!needed.length) return;
    const names = [...new Set(needed.map((name) => (name.startsWith("music/") ? "music.paq" : name)))];
    let bytes;
    try {
      bytes = await download(names);
    } catch (error) {
      // An offline update keeps the usable old pack and retries next launch.
      if (!missing().length) { console.warn("game art update:", error); return; }
      throw error;
    }
    names.forEach((name, i) => (name === "music.paq" ? storeMusic(bytes[i]) : store(name, bytes[i])));
    if (missing().length) throw Error("incomplete download");
  }

  async function hydrate() {
    await new Promise((resolve, reject) => FS.syncfs(true, (error) => (error ? reject(error) : resolve())));
    for (;;) {
      try {
        await fetchMissing();
        break;
      } catch (error) {
        console.warn("game files:", error);
        if ((await offer()) === "picked") break;
      }
    }
    hydrated = true;
    await persist();
    upload();
  }

  // One tab owns the directory: another would write its stale copy over this
  // one's saves. The lock lasts as long as the page. Play here asks the owner to
  // save and reload, which hands the lock over; an owner that does not answer
  // (a frozen tab) loses it, stops saving and reloads. Web Locks exist only in
  // secure contexts: HTTPS, or localhost.
  const LOCK = "crimsonland /game";
  const channel = new BroadcastChannel(LOCK);
  function own() {
    hydrate().then(
      () => {
        ready();
      },
      (error) => stuck("Could not load the game files: " + (error.message ?? error)),
    );
    channel.onmessage = async (event) => {
      if (event.data !== "play here") return;
      await persist();
      moved = true;
      location.reload();
    };
    return new Promise(() => {});
  }
  // The game starts on a click (or Enter) on Play: the browser lets it make
  // sound only after one, and this one never reaches the game, so it skips no
  // intro.
  function ready() {
    const buttons = document.getElementById("ready");
    say(watching ?? "");
    progress.hidden = true;
    buttons.hidden = false;
    const play = document.getElementById("play");
    if (linked) play.firstChild.textContent = "Watch";
    play.focus();
    play.onclick = () => {
      buttons.hidden = true;
      say("Starting…");
      removeRunDependency("game files");
    };
    // A pad's A or Start plays too (the standard mapping's buttons 0 and 9), on
    // its release, so the game never sees the press.
    let held = false;
    const poll = () => {
      if (buttons.hidden) return;
      const down = [...navigator.getGamepads()].some((pad) => pad && (pad.buttons[0]?.pressed || pad.buttons[9]?.pressed));
      if (held && !down) return play.click();
      held = down;
      requestAnimationFrame(poll);
    };
    requestAnimationFrame(poll);
  }
  function lost(error) {
    if (error.name !== "AbortError") return stuck("Could not open the game files: " + (error.message ?? error));
    moved = true;
    location.reload();
  }
  function elsewhere() {
    const buttons = document.getElementById("elsewhere");
    say("Crimsonland is open in another tab.");
    buttons.hidden = false;
    document.getElementById("here").onclick = () => {
      buttons.hidden = true;
      say("Moving the game here…");
      const queued = new AbortController();
      const steal = setTimeout(() => {
        queued.abort();
        navigator.locks.request(LOCK, { steal: true }, own).catch(lost);
      }, 3000);
      navigator.locks.request(LOCK, { signal: queued.signal }, () => {
        clearTimeout(steal);
        return own();
      }).catch((error) => error.name === "AbortError" || lost(error));
      channel.postMessage("play here");
    };
  }

  /* PLAY_ANALYTICS */
  const playAnalytics = createPlayAnalytics();

  // The leaderboard (host/ranked.inc): the game queues each finished ranked run
  // in /game/leaderboard/outbox/ and asks for an upload, or for the player's
  // profile. As the Python port (src/crimson/leaderboard/client.py): a run the
  // service took, or already has, leaves the outbox; one it refuses moves to
  // rejected/ with the reason; offline, runs wait for the next try.
  const OUTBOX = "/game/leaderboard/outbox", REJECTED = "/game/leaderboard/rejected";
  const post = (path, body) =>
    fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body });
  let uploading = null;
  function upload() {
    uploading ??= (async () => {
      let names = [];
      try {
        names = FS.readdir(OUTBOX).filter((name) => name.endsWith(".json"));
      } catch {}
      for (const name of names) {
        const path = `${OUTBOX}/${name}`, entry = FS.readFile(path, { encoding: "utf8" });
        let response;
        try {
          response = await post("/api/runs", entry);
        } catch {
          break;
        }
        // The service is down or asks to slow down: the run waits.
        if (response.status >= 500 || response.status === 429) break;
        if (!response.ok && response.status !== 409) {
          const reason = (await response.json().catch(() => ({}))).reason ?? `HTTP ${response.status}`;
          FS.mkdirTree(REJECTED);
          FS.writeFile(`${REJECTED}/${name}`, JSON.stringify({ ...JSON.parse(entry), reason }));
        }
        FS.unlink(path);
      }
      if (names.length) await persist();
    })().finally(() => (uploading = null));
    return uploading;
  }
  // A short note over the game, with a link to follow.
  function tell(text, href) {
    const line = href ? Object.assign(document.createElement("a"), { href, target: "_blank", textContent: text }) : text;
    notice.replaceChildren(line);
    notice.hidden = false;
    unsaved = false;
    clearTimeout(tell.timer);
    tell.timer = setTimeout(() => (notice.hidden = true), 15000);
  }
  // The profile opens signed in as the game's key: the tab opens on the click,
  // while the browser still lets it, and goes to the profile once signed in;
  // where the browser blocks it, the profile waits in the note. The game shares
  // the site's origin, so it spends the sign-in link itself, as the link's
  // confirmation page would, and no link leaves the page.
  async function profile() {
    const tab = window.open("", "_blank");
    try {
      const public_key = Module.ccall("client_public_key", "string", [], []);
      const { challenge } = await (await post("/api/auth/challenge", JSON.stringify({ public_key }))).json();
      const signature = Module.ccall("client_sign_login", "string", ["string"], [challenge]);
      const { url } = await (await post("/api/auth/login", JSON.stringify({ public_key, challenge, signature }))).json();
      const token = new URL(url).pathname.split("/").pop();
      const signed = await post("/api/login", JSON.stringify({ token }));
      if (!signed.ok) throw Error("sign-in refused");
      const page = `/players/${(await signed.json()).account}`;
      if (tab) tab.location = page;
      else tell("Open your profile", page);
    } catch {
      tab?.close();
      tell("Can't reach the leaderboard.");
    }
  }
  // Update scores: waiting runs go first, then the board comes back to the screen.
  async function scores() {
    let answer = null;
    try {
      await upload();
      const response = await post("/api/scores", Module.ccall("client_scores_request", "string", [], []));
      if (response.ok) answer = await response.text();
    } catch {}
    Module.ccall("client_scores_received", null, ["string"], [answer]);
  }
  setInterval(upload, 600000);
  // A board run's replay to watch, into the folder the game reads it from; the
  // leaderboard no longer having it is told apart from a failed fetch.
  const REPLAY_LIMIT = 16 << 20;
  async function replay() {
    const run = Module.ccall("client_replay_download", "string", [], []);
    let result = 2;
    try {
      const response = await fetch(`/runs/${encodeURIComponent(run)}.crd`);
      if (response.status === 404) result = 1;
      else if (response.ok) {
        const bytes = new Uint8Array(await response.arrayBuffer());
        if (bytes.length <= REPLAY_LIMIT) {
          FS.mkdirTree("/game/replays/online");
          FS.writeFile(`/game/replays/online/${run}.crd`, bytes);
          result = 0;
        }
      }
    } catch {}
    Module.ccall("client_replay_downloaded", null, ["number"], [result]);
  }
  let watching = null;
  // The run's summary, which its card waits for: null when there is none.
  const summary =
    linked && /^[A-Za-z0-9_-]{1,64}$/.test(linked)
      ? fetch(`/api/runs/${linked}`)
          .then((response) => (response.ok ? response.json() : null))
          .catch(() => null)
      : Promise.resolve(null);
  summary.then((run) => {
    if (!run) return;
    const score = run.board === "survival" ? `${run.score.toLocaleString("en-US")} xp` : `${(run.score / 1000).toFixed(2)} s`;
    watching = `${run.name}'s ${run.title} run, ${score}`;
    if (!document.getElementById("ready").hidden) say(watching);
  });
  const questSummary =
    !linked && linkedQuest && /^[0-9a-f]{12}$/.test(linkedQuest)
      ? fetch(`/api/custom/${linkedQuest}`)
          .then((response) => (response.ok ? response.json() : null))
          .catch(() => null)
      : Promise.resolve(null);
  questSummary.then((q) => {
    if (!q) return;
    watching = `${q.title}${q.author ? ` by ${q.author}` : ""}`;
    if (!document.getElementById("ready").hidden) say(watching);
  });
  async function questLink(id) {
    if (!/^[0-9a-f]{12}$/.test(id)) return;
    let response, bytes;
    try {
      response = await fetch(`/custom/${id}.bin`);
      if (response.ok) bytes = new Uint8Array(await response.arrayBuffer());
    } catch {}
    if (!bytes || bytes.length !== 6184)
      return tell(response?.status === 404 ? "This quest was not found." : "Could not download this quest.");
    const path = `quests/online/${id}.bin`;
    FS.mkdirTree("/game/quests/online");
    FS.writeFile(`/game/${path}`, bytes);
    const details = await questSummary;
    const start = () => {
      const why = Module.ccall("client_play_quest", "string", ["string", "string", "string"], [
        path,
        details?.title ?? "Custom quest",
        details?.author ?? "",
      ]);
      if (why === "wait") setTimeout(start, 250);
      else if (why) tell(why);
    };
    start();
  }
  async function watchLink(run) {
    if (!/^[A-Za-z0-9_-]{1,64}$/.test(run)) return tell("This replay link is malformed.");
    if (Number.isNaN(linkTick) || Number.isNaN(linkStop) || (linkStop !== null && linkStop <= (linkTick ?? 1)))
      return tell("This link's moment is malformed.");
    let response, bytes;
    try {
      response = await fetch(`/runs/${run}.crd`);
      if (response.ok) bytes = new Uint8Array(await response.arrayBuffer());
    } catch {}
    if (!bytes || bytes.length > REPLAY_LIMIT)
      return tell(response?.status === 404 ? "This run is no longer on the leaderboard." : "Could not download this run.");
    const path = `replays/online/${run}.crd`;
    FS.mkdirTree("/game/replays/online");
    FS.writeFile(`/game/${path}`, bytes);
    // The run's card: its runner, rank (0 for none), and the day the board took it.
    const details = await summary;
    const day = details ? new Date(details.accepted_at) : null;
    const start = () => {
      const why = Module.ccall("client_watch", "string", ["string", "string", "string", "number", "number", "number", "number"], [
        path,
        run,
        details?.name ?? "",
        details?.rank ?? 0,
        day ? day.getDate() : 0,
        day ? day.getMonth() + 1 : 0,
        day ? day.getFullYear() : 2000,
      ]);
      if (why === "wait") return setTimeout(start, 250);
      if (why) return tell(why);
      if (linkTick !== null || linkStop !== null) {
        const bad = Module.ccall("client_watch_moment", "string", ["number", "number"], [linkTick ?? 0, linkStop ?? 0]);
        if (bad) return tell(bad);
        if (linkStop !== null) shareStop.value = String((givenStop = linkStop));
        shareFull.href = `?watch=${encodeURIComponent(run)}`;
        shareFull.hidden = false;
      }
    };
    start();
  }

  var Module = {
    analyticsReady: () => playAnalytics.ready(),
    playActivity: (mode, run) => playAnalytics.activity(mode, run),
    // HOST_LEADERBOARD_PROFILE, _UPLOAD, _SCORES and _REPLAY (game/host_abi.h).
    leaderboard: (request) => [profile, upload, scores, replay][request - 1](),
    canvas,
    arguments: ["/game"],
    preRun: [() => {
      FS.mkdir("/game");
      FS.mount(IDBFS, {}, "/game");
      addRunDependency("game files");
      if (!navigator.locks) return stuck("Crimsonland needs HTTPS (or localhost) to keep its saves.");
      navigator.locks.request(LOCK, { ifAvailable: true }, (lock) => (lock ? own() : elsewhere())).catch(lost);
    }],
    // The host is running: the game takes the page.
    onRuntimeInitialized: () => {
      cover.hidden = true;
      // An embedding page can withhold fullscreen.
      fullscreen.hidden = !document.fullscreenEnabled;
      showFullscreen(3000);
      canvas.focus();
      if (linked) watchLink(linked);
      else if (linkedQuest) questLink(linkedQuest);
    },
    // A board run plays, its playback prepared, with `ticks`, or 0 once none
    // plays (client/main.cpp): the share bar comes and goes with it.
    watching: (ticks) => {
      share.hidden = !ticks;
      if (ticks && !watchTicks) showFullscreen(3000);
      watchTicks = ticks;
      if (ticks) shareStop.placeholder = `${ticks}`;
    },
    printErr: (text) => console.warn(text),
    // The game quit (client/main.cpp) after writing its settings and scores.
    quit: async () => {
      playAnalytics.activity(0, 0);
      playAnalytics.flush();
      cover.hidden = false;
      share.hidden = true;
      fullscreen.hidden = true;
      home.classList.add("shown");
      progress.hidden = true;
      say("Saving…");
      const saved = await persist();
      if (saved && leaving) return location.assign(home.href);
      say(saved ? "Your progress is saved." : notice.textContent);
      document.getElementById("again").hidden = false;
    },
  };
  // Saves and settings reach IndexedDB a few seconds after the game writes them,
  // and when the tab is hidden.
  setInterval(persist, 5000);
  document.addEventListener("visibilitychange", () => document.hidden && persist());
</script>
