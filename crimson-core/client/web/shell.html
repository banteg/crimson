<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play · crimson.land</title>
<style>
  /* The site's look (service/web/src/style.css): its game font and colours. */
  @font-face { font-family: "Crimson Small"; src: url(/ui/small.woff2) format("woff2"); font-display: swap; }
  :root { --text: #e6e6e6; --label: #b3b3b3; --dim: #7d7d7d; --row: rgb(70 180 240 / 0.6); --row-on: rgb(70 180 240); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a07; color: var(--text);
    font: 15px/1.5 "Crimson Small", Arial, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  a { color: var(--row-on); }
  #cover { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 16px; background: #0b0a07; }
  #cover img { width: min(512px, 90vw); filter: drop-shadow(7px 7px 0 rgb(0 0 0 / 0.267)); }
  #status { min-height: 1.5em; color: var(--label); }
  #progress { width: min(360px, 80vw); height: 4px; background: rgb(255 255 255 / 0.1); }
  #progress div { height: 100%; width: 0; background: var(--row-on); transition: width 0.1s linear; }
  #touch { max-width: 420px; color: var(--dim); }
  #again:not([hidden]) { display: flex; gap: 16px; align-items: center; }
  button, #pick label { font: inherit; color: rgb(255 255 255 / 0.7); background: rgb(30 40 55 / 0.85);
    border: 1px solid rgb(70 180 240 / 0.4); border-radius: 3px; padding: 4px 12px; cursor: pointer; }
  button:hover, #pick label:hover { color: #fff; border-color: var(--row-on); }
  #pick input { display: none; }
  /* The bar over the game: back to the site, and fullscreen. It shows while the cursor is near it. */
  #bar { position: fixed; top: 8px; right: 8px; display: flex; gap: 10px; align-items: center;
    padding: 4px 6px 4px 12px; background: rgb(11 10 7 / 0.7); border-radius: 4px;
    transition: opacity 0.3s; opacity: 0; pointer-events: none; }
  #bar.shown { opacity: 1; pointer-events: auto; }
  #bar a { color: var(--label); text-decoration: none; }
  #notice { color: #f0a050; }
  #bar a:hover { color: #fff; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="cover">
  <img src="/ui/sign.png" alt="Crimsonland" onerror="this.hidden = true">
  <div id="status">Loading…</div>
  <div id="progress" hidden><div></div></div>
  <div id="pick" hidden><label>Choose your Crimsonland folder…<input type="file" webkitdirectory></label></div>
  <div id="again" hidden><button type="button" onclick="location.reload()">Play again</button> <a href="/">crimson.land</a></div>
  <p id="touch" hidden>Crimsonland plays with a keyboard and mouse, or a gamepad.</p>
</div>
<nav id="bar" hidden><span id="notice" hidden></span><a href="/">crimson.land</a><button id="fullscreen" type="button">Fullscreen</button></nav>
<script>
  // The game reads and writes its directory, /game, kept in IndexedDB. Files it
  // lacks come from ?assets=<url>, default ./game/ (the project's distribution:
  // crimson.paq, sfx.paq, and music.paq, which is unpacked into music/, where the
  // executable plays its music from), or else from the player's own game folder,
  // whose grim.dll comes along (game/resources.cpp).
  const FILES = ["crimson.paq", "sfx.paq"];
  // The music the executable plays by name, and the file naming the in-game tunes.
  const MUSIC = ["intro", "crimson_theme", "crimsonquest", "shortie_monk"].map((name) => `music/${name}.ogg`);
  const TUNES = "music/game_tunes.txt";
  const base = new URLSearchParams(location.search).get("assets") ?? "game/";
  const status = document.getElementById("status");
  const progress = document.getElementById("progress");
  const cover = document.getElementById("cover");
  const canvas = document.getElementById("canvas");
  const say = (text) => (status.textContent = text);
  // The right button is the game's (reload, by default), not the browser's menu.
  canvas.addEventListener("contextmenu", (event) => event.preventDefault());
  if (matchMedia("(pointer: coarse)").matches && !matchMedia("(any-pointer: fine)").matches)
    document.getElementById("touch").hidden = false;

  // A button released while the page was away never reaches SDL, which then
  // drops the next press as a repeat. The first mouse event back carries the
  // real buttons: SDL hears a release (on the document, where it listens for
  // them) for each one that is up or about to be pressed, before the event.
  let away = false;
  addEventListener("blur", () => (away = true));
  for (const type of ["pointermove", "pointerdown"])
    addEventListener(type, (event) => {
      if (!away || !event.isTrusted || event.pointerType !== "mouse") return;
      away = false;
      // MouseEvent.button to its MouseEvent.buttons bit: left, middle, right, back, forward.
      const bit = (button) => 1 << [0, 2, 1, 3, 4][button];
      // A press, also one chorded onto a held button (a pointermove), names its button.
      const pressing = event.button >= 0 && event.buttons & bit(event.button);
      const held = pressing ? event.buttons & ~bit(event.button) : event.buttons;
      for (const button of [0, 1, 2, 3, 4])
        if (!(held & bit(button)))
          document.dispatchEvent(new PointerEvent("pointerup", {
            pointerType: "mouse", pointerId: event.pointerId, button, buttons: held,
            clientX: event.clientX, clientY: event.clientY,
          }));
    }, true);

  // The bar shows while the cursor is near the top of the page, and briefly once
  // the game starts. Fullscreen keeps Escape for the game where the browser
  // allows it (the Keyboard Lock API); holding Escape still leaves.
  const bar = document.getElementById("bar");
  const notice = document.getElementById("notice");
  let hide;
  const showBar = (ms) => {
    bar.classList.add("shown");
    clearTimeout(hide);
    hide = setTimeout(() => notice.hidden && bar.classList.remove("shown"), ms);
  };
  addEventListener("pointermove", (event) => event.clientY < 60 && showBar(1500));
  // A failed save stays in the bar until a save succeeds; the game plays on.
  const saveFailed = (error) => {
    notice.textContent = "Could not save: " + (error.message ?? error);
    notice.hidden = false;
    bar.classList.add("shown");
  };
  document.getElementById("fullscreen").onclick = async () => {
    if (document.fullscreenElement) return document.exitFullscreen();
    await document.documentElement.requestFullscreen();
    await navigator.keyboard?.lock?.(["Escape"]).catch(() => {});
    canvas.focus();
  };
  document.addEventListener("fullscreenchange", () => {
    document.getElementById("fullscreen").textContent = document.fullscreenElement ? "Exit fullscreen" : "Fullscreen";
  });

  // Writes /game back to IndexedDB, one sync at a time and only once it has been
  // read: IndexedDB takes the written tree as the whole directory. Resolves
  // whether the saves committed.
  let hydrated = false, syncing = null, again = false;
  function persist() {
    if (!hydrated) return Promise.resolve(false);
    if (syncing) {
      again = true;
      return syncing;
    }
    syncing = new Promise((resolve) => FS.syncfs(false, (error) => {
      if (error) saveFailed(error);
      else notice.hidden = true;
      resolve(!error);
    })).then((ok) => {
      syncing = null;
      if (!again) return ok;
      again = false;
      return persist();
    });
    return syncing;
  }

  const store = (name, bytes) => {
    FS.mkdirTree("/game/" + name.slice(0, name.lastIndexOf("/") + 1));
    FS.writeFile("/game/" + name, bytes);
  };
  const exists = (name) => FS.analyzePath("/game/" + name).exists;
  // The game files /game lacks, the tunes game_tunes.txt adds among them.
  function missing() {
    const tunes = exists(TUNES)
      ? [...FS.readFile("/game/" + TUNES, { encoding: "utf8" }).matchAll(/^snd_addGameTune\s+(\S+)/gm)].map((m) => "music/" + m[1])
      : [TUNES];
    return [...FILES, ...MUSIC, ...tunes].filter((name) => !exists(name));
  }

  // A PAQ's entries: a NUL-terminated name, a little-endian size, the bytes.
  function paq(bytes) {
    const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    // "paq\0" as a number: the minified page would hold a raw NUL, which HTML replaces.
    if (bytes.length < 4 || view.getUint32(0) !== 0x70617100) throw Error("not a PAQ");
    const entries = [];
    for (let at = 4; at < bytes.length; ) {
      const end = bytes.indexOf(0, at);
      if (end < 0 || end + 5 > bytes.length) throw Error("truncated PAQ");
      const size = view.getUint32(end + 1, true);
      if (end + 5 + size > bytes.length) throw Error("truncated PAQ");
      entries.push([new TextDecoder("latin1").decode(bytes.subarray(at, end)), bytes.subarray(end + 5, end + 5 + size)]);
      at = end + 5 + size;
    }
    return entries;
  }
  const storeMusic = (bytes) => {
    for (const [name, data] of paq(bytes)) store("music/" + name.split("/").pop(), data);
  };

  // The files the player picks, matched by name inside the chosen folder: the
  // GOG release's (music as loose files) or the project's (music.paq), over
  // whatever a failed download left. The directory must then be complete.
  function pickFolder() {
    const pick = document.getElementById("pick");
    pick.hidden = false;
    progress.hidden = true;
    say("The game files did not download. Crimsonland can play from your own copy.");
    return new Promise((resolve) => {
      pick.querySelector("input").onchange = async (event) => {
        const files = new Map(
          [...event.target.files].map((f) => [f.webkitRelativePath.split("/").slice(1).join("/").toLowerCase(), f]),
        );
        try {
          for (const [name, file] of files)
            if (FILES.includes(name) || name === "grim.dll" || name.startsWith("music/")) store(name, new Uint8Array(await file.arrayBuffer()));
          if (files.has("music.paq")) storeMusic(new Uint8Array(await files.get("music.paq").arrayBuffer()));
        } catch (error) {
          return say("Could not read that folder: " + (error.message ?? error));
        }
        // Nothing reaches IndexedDB until the directory is complete.
        const lacking = missing(), named = lacking.filter((name) => !name.startsWith("music/"));
        const music = lacking.length - named.length;
        if (lacking.length) return say(`That folder lacks ${[...named, ...(music ? [`${music} music files`] : [])].join(", ")}.`);
        pick.hidden = true;
        resolve();
      };
    });
  }

  // Downloads, with their progress across every file still to come.
  async function download(names) {
    const responses = await Promise.all(names.map((name) => fetch(new URL(name, new URL(base, location.href)))));
    const failed = responses.find((response) => !response.ok);
    if (failed) throw Error(failed.url + ": " + failed.status);
    const total = responses.reduce((sum, response) => sum + Number(response.headers.get("content-length") ?? 0), 0);
    let received = 0;
    progress.hidden = false;
    return Promise.all(responses.map(async (response) => {
      const chunks = [];
      for (const reader = response.body.getReader(); ; ) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        if (total) progress.firstElementChild.style.width = (100 * Math.min(received / total, 1)) + "%";
        const mb = (bytes) => (bytes / 1048576).toFixed(1);
        say(`Downloading the game: ${total ? `${mb(received)} of ${mb(total)}` : mb(received)} MB`);
      }
      const bytes = new Uint8Array(chunks.reduce((sum, chunk) => sum + chunk.length, 0));
      chunks.reduce((at, chunk) => (bytes.set(chunk, at), at + chunk.length), 0);
      return bytes;
    }));
  }

  async function hydrate() {
    await new Promise((resolve, reject) => FS.syncfs(true, (error) => (error ? reject(error) : resolve())));
    const needed = missing();
    if (needed.length) {
      const names = [...new Set(needed.map((name) => (name.startsWith("music/") ? "music.paq" : name)))];
      try {
        const bytes = await download(names);
        names.forEach((name, i) => (name === "music.paq" ? storeMusic(bytes[i]) : store(name, bytes[i])));
        if (missing().length) throw Error("incomplete download");
      } catch {
        await pickFolder();
      }
    }
    hydrated = true;
  }

  var Module = {
    canvas,
    arguments: ["/game"],
    preRun: [() => {
      FS.mkdir("/game");
      FS.mount(IDBFS, {}, "/game");
      addRunDependency("game files");
      // One tab owns the directory: another would write its stale copy over
      // this one's saves. The lock lasts as long as the page. Web Locks exist
      // only in secure contexts: HTTPS, or localhost.
      if (!navigator.locks) return say("Crimsonland needs HTTPS (or localhost) to keep its saves.");
      navigator.locks.request("crimsonland /game", { ifAvailable: true }, (lock) => {
        if (!lock) return say("Crimsonland is already open in another tab.");
        hydrate().then(
          () => {
            say("Starting…");
            removeRunDependency("game files");
          },
          (error) => say("Could not load the game files: " + (error.message ?? error)),
        );
        return new Promise(() => {});
      }).catch((error) => say("Could not open the game files: " + (error.message ?? error)));
    }],
    // The host is running: the game takes the page.
    onRuntimeInitialized: () => {
      cover.hidden = true;
      bar.hidden = false;
      showBar(3000);
      canvas.focus();
    },
    printErr: (text) => console.warn(text),
    // The game quit (client/main.cpp) after writing its settings and scores.
    quit: async () => {
      cover.hidden = false;
      bar.hidden = true;
      progress.hidden = true;
      say("Saving…");
      const saved = await persist();
      say(saved ? "Your progress is saved." : notice.textContent);
      document.getElementById("again").hidden = false;
    },
  };
  // Saves and settings reach IndexedDB a few seconds after the game writes them,
  // and when the tab is hidden.
  setInterval(persist, 5000);
  document.addEventListener("visibilitychange", () => document.hidden && persist());
</script>

</body>
</html>
