#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "local"
hooks = [
    { id = "py-ruff", name = "py-ruff", entry = "uv run ruff check .", language = "system", pass_filenames = false, stages = ["pre-commit"], files = "^(src/|tests/|scripts/|tools/|pyproject\\.toml|uv\\.lock|justfile)" },
    { id = "py-types", name = "py-types", entry = "uv run ty check src tests", language = "system", pass_filenames = false, stages = ["pre-commit"], files = "^(src/|tests/|pyproject\\.toml|uv\\.lock|justfile)" },
    { id = "docs-check", name = "docs-check", entry = "uv run scripts/check_docs.py", language = "system", pass_filenames = false, stages = ["pre-commit"], files = "^(docs/|readme\\.md|zensical\\.toml|scripts/check_docs\\.py|justfile)" },
    { id = "ast-grep-scan", name = "ast-grep-scan", entry = "ast-grep scan", language = "system", pass_filenames = false, stages = ["pre-commit"], files = "^(src/|tests/|tools/ast-grep/|sgconfig\\.yml|justfile)" },
    { id = "ast-grep-test", name = "ast-grep-test", entry = "ast-grep test", language = "system", pass_filenames = false, stages = ["pre-commit"], files = "^(tools/ast-grep/|sgconfig\\.yml|justfile)" },
    { id = "zig-lint", name = "zig-lint", entry = "ziglint", language = "system", stages = ["pre-commit"], files = "^crimson-zig/(src/.*\\.zig|build\\.zig)$", priority = 260 },
    # Slow matrix gates stay available explicitly and run in CI/`just check`.
    { id = "py-pytest", name = "py-pytest", entry = "uv run pytest", language = "system", pass_filenames = false, stages = ["manual"], files = "^(src/|tests/|pyproject\\.toml|uv\\.lock|justfile)" },
    { id = "py-build", name = "py-build", entry = "uv build", language = "system", pass_filenames = false, stages = ["pre-push"], files = "^(src/|pyproject\\.toml|uv\\.lock|readme\\.md|justfile)" },
    { id = "decomp-report", name = "decomp-report", entry = "uv run --no-sync crimson match report", language = "system", pass_filenames = false, stages = ["pre-push"], files = "^(src/crimson/|tools/match/|tools/native/|third_party/|analysis/|pyproject\\.toml|uv\\.lock|prek\\.toml|\\.github/workflows/decomp\\.yml)" },
    { id = "zig-test", name = "zig-test", entry = "bash -uc 'cd crimson-zig && zig build test --summary all'", language = "system", pass_filenames = false, stages = ["pre-push"], files = "^crimson-zig/", priority = 300 },
    { id = "zig-release", name = "zig-release", entry = "bash -uc 'cd crimson-zig && zig build -Doptimize=ReleaseFast'", language = "system", pass_filenames = false, stages = ["manual"], files = "^crimson-zig/", priority = 310 },
    { id = "zig-wasm", name = "zig-wasm", entry = "bash -uc 'cd crimson-zig && zig build wasm'", language = "system", pass_filenames = false, stages = ["manual"], files = "^crimson-zig/", priority = 320 },
]
