#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "local"
hooks = [
    { id = "py-ruff", name = "py-ruff", entry = "uv run ruff check .", language = "system", pass_filenames = false, stages = ["pre-commit"], files = "^(src/|tests/|scripts/|tools/|pyproject\\.toml|uv\\.lock|justfile)" },
    { id = "py-import-lints", name = "py-import-lints", entry = "uv run lint-imports", language = "system", pass_filenames = false, stages = ["pre-commit"], files = "^(src/|pyproject\\.toml|uv\\.lock|justfile)" },
    { id = "py-types", name = "py-types", entry = "uv run ty check src tests", language = "system", pass_filenames = false, stages = ["pre-commit"], files = "^(src/|tests/|pyproject\\.toml|uv\\.lock|justfile)" },
    { id = "docs-check", name = "docs-check", entry = "uv run scripts/check_docs.py", language = "system", pass_filenames = false, stages = ["pre-commit"], files = "^(docs/|readme\\.md|zensical\\.toml|scripts/check_docs\\.py|justfile)" },
    { id = "sg-scan", name = "sg-scan", entry = "sg scan", language = "system", pass_filenames = false, stages = ["pre-commit"], files = "^(src/|tests/|scripts/|tools/|docs/|analysis/|crimson-zig/|sgconfig\\.yml|justfile)" },
    { id = "sg-test", name = "sg-test", entry = "sg test", language = "system", pass_filenames = false, stages = ["pre-commit"], files = "^(tools/ast-grep/|sgconfig\\.yml|justfile)" },
    { id = "py-pytest", name = "py-pytest", entry = "uv run pytest", language = "system", pass_filenames = false, stages = ["pre-push"], files = "^(src/|tests/|pyproject\\.toml|uv\\.lock|justfile)" },
    { id = "py-build", name = "py-build", entry = "uv build", language = "system", pass_filenames = false, stages = ["pre-push"], files = "^(src/|pyproject\\.toml|uv\\.lock|readme\\.md|justfile)" },
    { id = "zig-check", name = "zig-check", entry = "just check-zig", language = "system", pass_filenames = false, stages = ["pre-push"], files = "^crimson-zig/" },
]
