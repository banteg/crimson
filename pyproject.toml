[project]
name = "crimsonland"
version = "0.11.1"
description = "A faithful reimplementation of Crimsonland 1.9.93 in Python and raylib"
keywords = ["crimsonland", "game", "shooter", "raylib", "reverse-engineering"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Arcade",
    "Operating System :: OS Independent",
]
readme = { file = "pypi.md", content-type = "text/markdown" }
requires-python = ">=3.13"
dependencies = [
    "construct>=2.10.70",
    "msgspec>=0.20.0",
    "pillow>=12.1.0",
    "platformdirs>=4.5.1",
    "raylib>=6.0.1.0",
    "structlog>=25.1.0",
    "tqdm>=4.67.3",
    "typer>=0.21.1",
    "zstandard>=0.25.0",
]

[project.urls]
Documentation = "https://crimson.banteg.xyz/"
Repository = "https://github.com/banteg/crimson"

[project.scripts]
crimsonland = "crimson.cli:main"
crimson = "crimson.cli:main"

[project.optional-dependencies]
charts = [
    "altair>=6.0.0",
    "vl-convert-python>=1.9.0.post1",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["crimson", "grim"]

[tool.uv.workspace]
members = ["crimson-re"]

[tool.uv.sources]
crimson-re = { workspace = true }
asm-differ = { git = "https://github.com/simonlindholm/asm-differ", rev = "0dd09af8f8008f1f880327cf0aca3b26d2562ea2" }

[dependency-groups]
dev = [
    "crimson-re",
    "mkdocstrings[python]>=1.0.6",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.9",
    "syrupy>=5.0.0",
    "ty>=0.0.84",
    "zensical>=0.0.22",
]
match-explain = [
    "asm-differ",
]

[tool.ruff]
line-length = 120
src = [".", "src", "crimson-re/src"]

[tool.ruff.lint]
extend-select = ["ARG", "B006", "B007", "B017", "B023", "B904", "B905", "BLE001", "C4", "COM812", "FURB", "I001", "ISC", "PGH003", "PT017", "RET", "RUF012", "RUF100", "S110", "S113", "S607", "SIM", "TRY004", "UP035"]
extend-ignore = [
    # Native branch shapes stay as if/else blocks.
    "SIM108",
    # Explicit native control flow preserves NaN behavior and decompilation provenance.
    "FURB136",
    "PLR1730",
    # Boundary casts document conversion points even when static types already say int.
    "RUF046",
]

[tool.ruff.lint.per-file-ignores]
# Quest builders share QuestBuilder's signature; most ignore rng.
# Fixtures, mock side effects and protocol fakes take arguments they don't use.
"tests/**" = ["ARG"]
# Frozen evidence and review probes keep the style they were recorded with.
"analysis/**" = ["ARG", "B905", "C4", "FURB", "I001", "ISC", "RET", "SIM"]
"tools/match/evidence/**" = ["ARG", "B905", "C4", "FURB", "I001", "ISC", "RET", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "crimson.creatures.spawn.CreatureFlags",
    "crimson.owner_ref.OwnerRef.from_local_player",
    "crimson.paths.default_runtime_dir",
    "crimson.sim.terrain_fx.TerrainFxBatch",
    "grim.color.RGBA",
    "grim.geom.Vec2",
    "typer.Argument",
    "typer.Option",
]
