name: Crimson client

on:
  workflow_call:
    inputs:
      desktop:
        description: Also build Linux and macOS clients when their inputs changed
        type: boolean
        default: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  WABT_VERSION: "1.0.42"
  SDL_VERSION: "3.4.18"
  EMSDK_VERSION: "6.0.10"

jobs:
  client:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.name == 'macos' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(inputs.desktop && '["web", "linux", "macos"]' || '["web"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check artwork upgrade behavior
        if: inputs.desktop && matrix.name == 'linux'
        run: |
          python3 crimson-core/checks/assets.py
          node --test crimson-core/checks/assets.test.mjs crimson-core/checks/analytics.test.mjs crimson-core/checks/coop.test.mjs

      - name: Check audio timing
        if: inputs.desktop && matrix.name == 'linux'
        run: python3 crimson-core/checks/audio.py

      - name: Download the shared game module
        uses: actions/download-artifact@v8
        with:
          name: runtime-game
          path: crimson-core/build/game
      - name: Name the web package inputs
        if: matrix.name == 'web'
        id: inputs
        run: python3 scripts/build_identity.py client web --wabt "$WABT_VERSION" --emscripten "$EMSDK_VERSION" --github-output "$GITHUB_OUTPUT"
      - name: Restore the web package
        if: matrix.name == 'web'
        id: web
        uses: actions/cache@v5
        with:
          path: crimson-core/build/dist/web
          key: client-web-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.fingerprint }}

      - name: Install wabt
        if: matrix.name != 'web' || steps.web.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 --retry-all-errors "https://github.com/WebAssembly/wabt/releases/download/${WABT_VERSION}/wabt-${WABT_VERSION}-${{ matrix.name == 'macos' && 'macos-arm64' || 'linux-x64' }}.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wabt-${WABT_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Setup Emscripten
        if: matrix.name == 'web' && steps.web.outputs.cache-hit != 'true'
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Install SDL3
        if: matrix.name == 'macos'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install sdl3 pkg-config

      - name: Name the Linux SDL3 inputs
        if: matrix.name == 'linux'
        id: sdl-inputs
        run: echo "image=${ImageOS:-$(lsb_release -rs)}" >> "$GITHUB_OUTPUT"

      - name: Restore SDL3
        if: matrix.name == 'linux'
        id: sdl
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/sdl
          key: sdl3-${{ env.SDL_VERSION }}-${{ runner.os }}-${{ steps.sdl-inputs.outputs.image }}-${{ runner.arch }}

      - name: Install Linux packages
        if: matrix.name == 'linux'
        run: |
          packages=(libgl-dev libcurl4-openssl-dev xvfb)
          if [[ "${{ steps.sdl.outputs.cache-hit }}" != true ]]; then
            packages+=(cmake ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
              libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
              libdecor-0-dev libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev)
          fi
          sudo apt-get update
          sudo apt-get install -y "${packages[@]}"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/sdl/lib/pkgconfig" >> "$GITHUB_ENV"

      # Ubuntu has no SDL3 package yet: build the release with its X11, Wayland
      # and audio backends, once per version.
      - name: Build SDL3
        if: matrix.name == 'linux' && steps.sdl.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 --retry-all-errors "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL3-${SDL_VERSION}.tar.gz" | tar xz -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/SDL3-${SDL_VERSION}" -B "$RUNNER_TEMP/sdl-build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl" -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/sdl-build"
          cmake --install "$RUNNER_TEMP/sdl-build"
      - name: Check desktop networking
        if: matrix.name != 'web'
        run: python3 crimson-core/checks/native_network.py

      - name: Build the client
        if: matrix.name != 'web' || steps.web.outputs.cache-hit != 'true'
        run: python3 crimson-core/client/build.py --target ${{ matrix.name == 'web' && 'web' || 'native' }} --skip-game --package

      - name: Download desktop smoke assets
        if: matrix.name == 'linux'
        run: |
          mkdir -p "$RUNNER_TEMP/game-assets"
          for name in crimson.paq sfx.paq music.paq; do
            curl --fail --location --retry 3 --retry-all-errors \
              --output "$RUNNER_TEMP/game-assets/$name" "https://paq.crimson.banteg.xyz/v1.9.93/$name"
          done

      - name: Exercise the packaged desktop client
        if: matrix.name == 'linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_AUDIODRIVER: dummy
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python3 crimson-core/checks/native_client_network.py crimson-core/build/dist/crimsonland/crimson "$RUNNER_TEMP/game-assets"

      - name: Check practice buttons and frame restoration
        if: matrix.name == 'linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_AUDIODRIVER: dummy
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python3 crimson-core/checks/native_practice.py crimson-core/build/dist/crimsonland/crimson "$RUNNER_TEMP/game-assets"
      - name: Verify the web identity and bytes
        if: matrix.name == 'web'
        env:
          FINGERPRINT: ${{ steps.inputs.outputs.fingerprint }}
        run: python3 scripts/build_identity.py check crimson-core/build/dist/web/build.json "$FINGERPRINT"

      # An artifact drops file modes: a tarball keeps the executables runnable.
      - name: Archive the build
        run: tar -C crimson-core/build/dist -czf "crimsonland-${{ matrix.name }}.tar.gz" .

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: crimsonland-${{ matrix.name }}
          path: crimsonland-${{ matrix.name }}.tar.gz
