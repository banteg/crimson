name: Zig CI

on:
  push:
    branches:
      - "master"
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zig:
    runs-on: ubuntu-latest
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/crimson-zig/.zig-cache-global
    defaults:
      run:
        working-directory: crimson-zig
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.15.2"

      - name: Install Zig system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglx-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Build + test
        run: |
          zig_cache_dir="$(mktemp -d)"
          export ZIG_GLOBAL_CACHE_DIR="$zig_cache_dir"
          export ZIG_LOCAL_CACHE_DIR="$zig_cache_dir"
          zig build test --summary all
          zig build -Doptimize=ReleaseFast

      - name: Wasm build
        run: zig build wasm
