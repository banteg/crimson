name: Crimson service

on:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Download the shared verifier
        uses: actions/download-artifact@v8
        with:
          name: runtime-wasm
          path: crimson-core/build/wasm
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Download and verify game assets
        uses: ./.github/actions/game-art
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
        working-directory: service
      - run: npm run assets
        working-directory: service
        env:
          UV_FROZEN: "1"
          UV_NO_DEV: "1"
      - run: npm run check
        working-directory: service
      - run: npm test
        working-directory: service
      # Every ranked production run, replayed through this verifier: a change that breaks a run fails here unless its
      # migrations retire it. Master publishes the verdicts and grounds for deploys of the same replay inputs.
      - name: Name the replay inputs
        id: replays
        working-directory: service
        run: node scripts/deploy-replays.mjs inputs
      # Both caches hold only what crimson.land serves publicly, so fork PRs may read them.
      - name: Restore the public replays
        uses: actions/cache@v5
        with:
          path: service/.reverify-public
          key: public-replays-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: public-replays-
      - name: Restore the verdicts for these replay inputs
        uses: actions/cache@v5
        with:
          path: service/.replay-verdicts
          key: replay-verdicts-${{ steps.replays.outputs.inputs }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: replay-verdicts-${{ steps.replays.outputs.inputs }}-
      - name: Replay the ranked production runs
        working-directory: service
        run: npm run reverify -- --public .replay-verdicts
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: replay-verdicts-${{ steps.replays.outputs.inputs }}
          path: service/.replay-verdicts
          # The directory is hidden, which upload-artifact skips unless asked.
          include-hidden-files: true
          if-no-files-found: error
