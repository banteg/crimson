name: Crimson service

on:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Download the shared verifier
        uses: actions/download-artifact@v4
        with:
          name: runtime-wasm
          path: crimson-core/build/wasm
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Download and verify game assets
        uses: ./.github/actions/game-art
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
        working-directory: service
      - run: npm run assets
        working-directory: service
      - run: npm run check
        working-directory: service
      - run: npm test
        working-directory: service
