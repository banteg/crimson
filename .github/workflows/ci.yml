name: CI

on:
  push:
    branches:
      - "master"
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: docs-check
            use_uv: true
            do_sync: false
            command: uv run --no-sync python scripts/check_docs.py
            sync_args: ""
          - task: resolved-name-audit
            use_uv: true
            do_sync: true
            command: uv run --no-sync crimson match resolved-name-audit --check
            sync_args: ""
          - task: ast-grep
            use_uv: false
            do_sync: false
            command: ast-grep scan && ast-grep test
            sync_args: ""
          - task: ruff
            use_uv: true
            do_sync: true
            command: uv run --no-sync ruff check .
            sync_args: --only-group dev
          - task: ty
            use_uv: true
            do_sync: true
            command: uv run --no-sync ty check src crimson-re/src tests
            sync_args: --group dev
          - task: pytest
            use_uv: true
            do_sync: true
            # A virtual display with software GL runs the render and terrain tests that need a raylib window.
            command: xvfb-run -a uv run --no-sync pytest --run-terrain
            sync_args: --group dev
          - task: native-oracle
            use_uv: true
            do_sync: true
            # Fail if Unicorn is missing instead of silently skipping the oracle tests.
            command: uv run --no-sync python -c "import unicorn" && CRIMSON_NATIVE_ORACLE=1 uv run --no-sync pytest -q tests/native_oracle
            sync_args: --group dev
          - task: native-closure
            use_uv: true
            do_sync: true
            command: uv run --no-sync crimson native verify --require-game-closure --allow-absent-toolchain
            sync_args: ""
          - task: match-regressions
            use_uv: true
            do_sync: true
            command: uv run --no-sync crimson match regressions --base "$MATCH_BASE"
            sync_args: ""
          - task: build
            use_uv: true
            do_sync: false
            command: uv build
            sync_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: ${{ matrix.task == 'match-regressions' && '0' || '1' }}

      - name: Detect documentation-only pull request
        id: docs_only
        if: ${{ github.event_name == 'pull_request' && (matrix.task == 'pytest' || matrix.task == 'native-oracle') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          docs_only=$(python3 scripts/ci_changed_paths.py docs-only --base "$BASE_SHA")
          if [[ "$docs_only" == true ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: matrix.use_uv && steps.docs_only.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Ensure uv cache dir exists
        if: matrix.use_uv && steps.docs_only.outputs.skip != 'true'
        run: |
          # setup-uv enables caching via UV_CACHE_DIR; create it eagerly for prune stability.
          if [[ -n "${UV_CACHE_DIR:-}" ]]; then
            mkdir -p "$UV_CACHE_DIR"
          fi

      - name: Install virtual display and GL libraries
        if: ${{ matrix.task == 'pytest' && steps.docs_only.outputs.skip != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgl1-mesa-dri \
            libgl1-mesa-dev \
            libglx-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev

      - name: Setup Node
        if: ${{ matrix.task == 'ast-grep' }}
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install ast-grep
        if: ${{ matrix.task == 'ast-grep' }}
        run: npm install --global @ast-grep/cli

      - name: Install dependencies
        if: matrix.do_sync && steps.docs_only.outputs.skip != 'true'
        run: uv sync --frozen ${{ matrix.sync_args }}

      - name: Download provenance artifacts
        if: ${{ (matrix.task == 'pytest' || matrix.task == 'native-oracle' || matrix.task == 'native-closure') && steps.docs_only.outputs.skip != 'true' }}
        run: |
          game_dir="game_bins/crimsonland/1.9.93-gog"
          base_url="https://paq.crimson.banteg.xyz/v1.9.93"

          mkdir -p "$game_dir"
          for name in crimsonland.exe grim.dll ogg.dll vorbis.dll vorbisfile.dll; do
            curl --fail --location --retry 3 --retry-all-errors \
              --output "$game_dir/$name" "$base_url/$name"
          done

          sha256sum --check <<'EOF'
          771531fe72c36dbcb7ca8d8a391f00884ced8240fbb17080ffc3e0e59482c4f4  game_bins/crimsonland/1.9.93-gog/crimsonland.exe
          373f1304511c2cdb06a36447cc96f281a270bfe96957ca8ff03e19cf03dc8e70  game_bins/crimsonland/1.9.93-gog/grim.dll
          308540dbd488f3bceca2dbadefe02cf29d10a27c4ac096bb3da053e3e0b923ea  game_bins/crimsonland/1.9.93-gog/ogg.dll
          b4fa55cfe7547ade0a2d5b800ef085ce20cdd71f61898d2461ea61eb0241812b  game_bins/crimsonland/1.9.93-gog/vorbis.dll
          f44472c6d9a64045c14583d12c0cfab5b4aa268aceb8bc9e3e1236b3008306f2  game_bins/crimsonland/1.9.93-gog/vorbisfile.dll
          EOF

      - name: Download runtime assets
        if: ${{ matrix.task == 'pytest' && steps.docs_only.outputs.skip != 'true' }}
        run: |
          mkdir -p artifacts/assets
          curl --fail --location --retry 3 --retry-all-errors \
            --output artifacts/assets/crimson.paq "https://paq.crimson.banteg.xyz/v1.9.93/crimson.paq"
          sha256sum --check <<'EOF'
          52ae564a2cb86de9f11be261338af942377b4340595a0df2a5ae41f468042547  artifacts/assets/crimson.paq
          EOF

      - name: Run check
        if: steps.docs_only.outputs.skip != 'true'
        env:
          MATCH_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ${{ matrix.command }}
