name: CI

on:
  push:
    branches:
      - "master"
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: lint-imports
            use_uv: true
            do_sync: true
            use_zig: false
            command: uv run --no-sync lint-imports
            sync_args: --group dev
          - task: docs-check
            use_uv: true
            do_sync: false
            use_zig: false
            command: uv run --no-sync python scripts/check_docs.py
            sync_args: ""
          - task: ast-grep
            use_uv: false
            do_sync: false
            use_zig: false
            command: sg scan && sg test && bash tools/ast-grep/scripts/build-zig-parser.sh tools/ast-grep/parsers/zig.so && sg scan -c sgconfig.ci.yml && sg test -c sgconfig.ci.yml
            sync_args: ""
          - task: ty
            use_uv: true
            do_sync: true
            use_zig: false
            command: uv run --no-sync ty check src
            sync_args: --group dev
          - task: ty-tests
            use_uv: true
            do_sync: true
            use_zig: false
            command: uv run --no-sync ty check tests
            sync_args: --group dev
          - task: pytest
            use_uv: true
            do_sync: true
            use_zig: true
            command: uv run --no-sync pytest --no-cov
            sync_args: --group dev
          - task: native-closure
            use_uv: true
            do_sync: true
            use_zig: false
            command: uv run --no-sync crimson native verify --require-game-closure --allow-absent-toolchain
            sync_args: ""
          - task: build
            use_uv: true
            do_sync: false
            use_zig: false
            command: uv build
            sync_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        if: matrix.use_uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Ensure uv cache dir exists
        if: matrix.use_uv
        run: |
          # setup-uv enables caching via UV_CACHE_DIR; create it eagerly for prune stability.
          if [[ -n "${UV_CACHE_DIR:-}" ]]; then
            mkdir -p "$UV_CACHE_DIR"
          fi

      - name: Setup Zig
        if: matrix.use_zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Install Zig system libraries
        if: matrix.use_zig
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglx-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev

      - name: Setup Node
        if: ${{ matrix.task == 'ast-grep' }}
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install ast-grep
        if: ${{ matrix.task == 'ast-grep' }}
        run: npm install --global @ast-grep/cli

      - name: Install dependencies
        if: matrix.do_sync
        run: uv sync --frozen ${{ matrix.sync_args }}

      - name: Download provenance artifacts
        if: ${{ matrix.task == 'pytest' || matrix.task == 'native-closure' }}
        run: |
          game_dir="game_bins/crimsonland/1.9.93-gog"
          base_url="https://paq.crimson.banteg.xyz/v1.9.93"

          mkdir -p "$game_dir"
          for name in crimsonland.exe grim.dll ogg.dll vorbis.dll vorbisfile.dll; do
            curl --fail --location --retry 3 --retry-all-errors \
              --output "$game_dir/$name" "$base_url/$name"
          done

          sha256sum --check <<'EOF'
          771531fe72c36dbcb7ca8d8a391f00884ced8240fbb17080ffc3e0e59482c4f4  game_bins/crimsonland/1.9.93-gog/crimsonland.exe
          373f1304511c2cdb06a36447cc96f281a270bfe96957ca8ff03e19cf03dc8e70  game_bins/crimsonland/1.9.93-gog/grim.dll
          308540dbd488f3bceca2dbadefe02cf29d10a27c4ac096bb3da053e3e0b923ea  game_bins/crimsonland/1.9.93-gog/ogg.dll
          b4fa55cfe7547ade0a2d5b800ef085ce20cdd71f61898d2461ea61eb0241812b  game_bins/crimsonland/1.9.93-gog/vorbis.dll
          f44472c6d9a64045c14583d12c0cfab5b4aa268aceb8bc9e3e1236b3008306f2  game_bins/crimsonland/1.9.93-gog/vorbisfile.dll
          EOF

      - name: Run check
        run: ${{ matrix.command }}
