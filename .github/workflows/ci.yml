name: CI

on:
  push:
    branches:
      - "master"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: lint-imports
            use_uv: true
            do_sync: true
            command: uv run --no-sync lint-imports
            sync_args: --group dev
          - task: docs-check
            use_uv: true
            do_sync: false
            command: uv run --no-sync python scripts/check_docs.py
            sync_args: ""
          - task: ast-grep
            use_uv: false
            do_sync: false
            command: sg scan && sg test
            sync_args: ""
          - task: ty
            use_uv: true
            do_sync: true
            command: uv run --no-sync ty check src
            sync_args: --group dev
          - task: ty-tests
            use_uv: true
            do_sync: true
            command: uv run --no-sync ty check tests
            sync_args: --group dev
          - task: pytest
            use_uv: true
            do_sync: true
            command: uv run --no-sync pytest
            sync_args: --group dev
          - task: build
            use_uv: true
            do_sync: false
            command: uv build
            sync_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        if: matrix.use_uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Ensure uv cache dir exists
        if: matrix.use_uv
        run: |
          # setup-uv enables caching via UV_CACHE_DIR; create it eagerly for prune stability.
          if [[ -n "${UV_CACHE_DIR:-}" ]]; then
            mkdir -p "$UV_CACHE_DIR"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ast-grep
        run: npm install --global @ast-grep/cli

      - name: Install dependencies
        if: matrix.do_sync
        run: uv sync --frozen ${{ matrix.sync_args }}

      - name: Run check
        run: ${{ matrix.command }}

      - name: Add coverage to summary
        if: ${{ always() && matrix.task == 'pytest' }}
        run: |
          {
            echo "## Coverage"
            echo ""
            uv run --no-sync python -m coverage report || true
          } >> "$GITHUB_STEP_SUMMARY"

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust fmt check
        run: cargo fmt --all --manifest-path crimson-rust/Cargo.toml --check

      - name: Rust check
        run: cargo check --workspace --manifest-path crimson-rust/Cargo.toml

      - name: Rust test
        run: cargo test --workspace --manifest-path crimson-rust/Cargo.toml

      - name: Rust wasm build
        run: cargo build -p crimson-rust-wasm --release --target wasm32-unknown-unknown --manifest-path crimson-rust/Cargo.toml
