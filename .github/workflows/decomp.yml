name: Decompilation progress

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Fetch pinned reference images
        run: |
          set -o pipefail
          # Every reported build's images, mirrored at paq.crimson.banteg.xyz/v<build>/.
          uv run --no-sync python -c '
          import json
          for build in json.load(open("decomp/builds.json"))["builds"]:
              if build.get("reported"):
                  for image in build["images"]:
                      print(build["id"], build["tree"], image["name"], image["sha256"])
          ' | while read -r build tree name sha256; do
            mkdir -p "$tree"
            curl --fail --location --retry 3 --retry-all-errors \
              --output "$tree/$name" "https://paq.crimson.banteg.xyz/v$build/$name"
            echo "$sha256  $tree/$name" | sha256sum --check
          done

      - name: Verify matching evidence and export progress
        run: uv run --no-sync crimson match report

      - name: Validate with objdiff's report parser
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$RUNNER_TEMP/objdiff-cli" \
            https://github.com/encounter/objdiff/releases/download/v3.8.1/objdiff-cli-linux-x86_64
          echo "c8290281e82114bcc1a06ff73061110d3902a177822e750337de2537188e358f  $RUNNER_TEMP/objdiff-cli" | sha256sum --check
          chmod +x "$RUNNER_TEMP/objdiff-cli"
          for report in artifacts/decomp/*/report.json; do
            "$RUNNER_TEMP/objdiff-cli" report changes "$report" "$report"
          done

      - name: Upload 1.9.93 measurement diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: 1.9.93_measurement
          path: artifacts/decomp/1.9.93/report.metrics.json
          if-no-files-found: error

      - name: Upload 1.9.93 progress report
        uses: actions/upload-artifact@v4
        with:
          name: 1.9.93_report
          path: artifacts/decomp/1.9.93/report.json
          if-no-files-found: error

      - name: Upload 1.9.8 measurement diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: 1.9.8_measurement
          path: artifacts/decomp/1.9.8/report.metrics.json
          if-no-files-found: error

      - name: Upload 1.9.8 progress report
        uses: actions/upload-artifact@v4
        with:
          name: 1.9.8_report
          path: artifacts/decomp/1.9.8/report.json
          if-no-files-found: error
