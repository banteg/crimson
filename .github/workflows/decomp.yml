name: Decompilation progress

# Run for the saved evidence, its inputs, and the Python CLI that verifies it.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - uses: actions/checkout@v5
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != pull_request && "$EVENT_NAME" != push ]] || [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          relevant=$(python3 scripts/ci_changed_paths.py decomp --base "$BASE_SHA")
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  builds:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.registry.outputs.versions }}
    steps:
      - uses: actions/checkout@v5
      - id: registry
        name: Select reported builds
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          builds = json.load(open("decomp/builds.json"))["builds"]
          print("versions=" + json.dumps([build["id"] for build in builds if build.get("reported")]))
          PY

  report:
    needs: builds
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.builds.outputs.versions) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPORT_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Fetch pinned reference images
        run: |
          set -o pipefail
          # Each build's images, mirrored at paq.crimson.banteg.xyz/v<build>/.
          uv run --no-sync python -c '
          import json, os
          for build in json.load(open("decomp/builds.json"))["builds"]:
              if build["id"] == os.environ["REPORT_VERSION"]:
                  for image in build["images"]:
                      print(build["id"], build["tree"], image["name"], image["sha256"])
          ' | while read -r build tree name sha256; do
            mkdir -p "$tree"
            curl --fail --location --retry 3 --retry-all-errors \
              --output "$tree/$name" "https://paq.crimson.banteg.xyz/v$build/$name?sha256=$sha256"
            echo "$sha256  $tree/$name" | sha256sum --check
          done

      - name: Verify matching evidence and export progress
        env:
          BASELINE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          baseline_args=()
          if [[ -n "$BASELINE_COMMIT" && ! "$BASELINE_COMMIT" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$BASELINE_COMMIT"
            baseline="$RUNNER_TEMP/previous-evidence.json"
            if git show "$BASELINE_COMMIT:analysis/decomp/$REPORT_VERSION.json" > "$baseline"; then
              baseline_args=(--baseline "$baseline")
            fi
          fi
          uv run --no-sync crimson match report --version "$REPORT_VERSION" "${baseline_args[@]}"

      - name: Summarize scoped progress and inventory coverage
        run: cat "artifacts/decomp/$REPORT_VERSION/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate with objdiff's report parser
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$RUNNER_TEMP/objdiff-cli" \
            https://github.com/encounter/objdiff/releases/download/v3.8.1/objdiff-cli-linux-x86_64
          echo "c8290281e82114bcc1a06ff73061110d3902a177822e750337de2537188e358f  $RUNNER_TEMP/objdiff-cli" | sha256sum --check
          chmod +x "$RUNNER_TEMP/objdiff-cli"
          for report in artifacts/decomp/*/report.json; do
            "$RUNNER_TEMP/objdiff-cli" report changes "$report" "$report"
          done

      - name: Upload measurement diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}_measurement
          path: |
            artifacts/decomp/${{ matrix.version }}/report.metrics.json
            artifacts/decomp/${{ matrix.version }}/report.md
          if-no-files-found: error

      - name: Upload progress report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}_report
          path: artifacts/decomp/${{ matrix.version }}/report.json
          if-no-files-found: error

  gate:
    name: decomp-gate
    needs: [changes, builds, report]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require reports when relevant
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          BUILDS_RESULT: ${{ needs.builds.result }}
          REPORT_RESULT: ${{ needs.report.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [[ "$RELEVANT" == true ]]; then
            test "$BUILDS_RESULT" = success
            test "$REPORT_RESULT" = success
          else
            test "$RELEVANT" = false
            test "$BUILDS_RESULT" = skipped
            test "$REPORT_RESULT" = skipped
          fi
