name: Runtime build

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --no-dev
        if: inputs.target == 'game'
      - name: Name the compiler inputs
        id: inputs
        env:
          TARGET: ${{ inputs.target }}
        run: uv run --no-sync python scripts/build_identity.py runtime "$TARGET" --github-output "$GITHUB_OUTPUT"
      - name: Restore the compiled module
        id: binary
        uses: actions/cache@v4
        with:
          path: |
            crimson-core/build/${{ inputs.target }}/${{ steps.inputs.outputs.binary }}
            crimson-core/build/${{ inputs.target }}/${{ steps.inputs.outputs.binary }}.build.json
          key: runtime-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.fingerprint }}
      - name: Restore wasi-sdk
        id: wasi-sdk
        if: steps.binary.outputs.cache-hit != 'true' && inputs.target != 'native'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/wasi-sdk
          key: wasi-sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.wasi_sdk_version }}
      - name: Download wasi-sdk
        if: steps.binary.outputs.cache-hit != 'true' && inputs.target != 'native' && steps.wasi-sdk.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.inputs.outputs.wasi_sdk_version }}
        run: |
          archive="wasi-sdk-$VERSION-x86_64-linux.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors --output "$RUNNER_TEMP/$archive" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${VERSION%%.*}/$archive"
          sha256sum --check <<EOF
          b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  $RUNNER_TEMP/$archive
          EOF
          mkdir -p "$RUNNER_TEMP/wasi-sdk"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/wasi-sdk" --strip-components=1
      - name: Compile the module
        if: steps.binary.outputs.cache-hit != 'true'
        env:
          TARGET: ${{ inputs.target }}
          WASI_SDK_PATH: ${{ runner.temp }}/wasi-sdk
        run: |
          uv run --no-sync python scripts/ci_benchmark.py --out crimson-core/build/timings.jsonl --name "build-$TARGET" -- \
            python crimson-core/build.py --target "$TARGET"
      - name: Verify the restored or compiled identity and bytes
        env:
          BINARY: ${{ steps.inputs.outputs.binary }}
          FINGERPRINT: ${{ steps.inputs.outputs.fingerprint }}
          TARGET: ${{ inputs.target }}
        run: uv run --no-sync python scripts/build_identity.py check "crimson-core/build/$TARGET/$BINARY.build.json" "$FINGERPRINT"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ inputs.target }}
          path: |
            crimson-core/build/${{ inputs.target }}/${{ steps.inputs.outputs.binary }}
            crimson-core/build/${{ inputs.target }}/${{ steps.inputs.outputs.binary }}.build.json
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ inputs.target }}-diagnostics
          path: |
            crimson-core/build/timings.jsonl
            crimson-core/build/${{ inputs.target }}/errors.txt
            crimson-core/build/${{ inputs.target }}/link.log
