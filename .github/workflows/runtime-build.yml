name: Runtime build

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      suite:
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ZIG_VERSION: "0.17.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --no-dev
        if: inputs.target == 'game'
      - name: Name the compiler inputs
        id: inputs
        env:
          TARGET: ${{ inputs.target }}
          SUITE: ${{ inputs.suite }}
        run: |
          compiler="zig$ZIG_VERSION"
          if [[ "$TARGET" == native ]]; then
            compiler="$compiler-$(clang++ --version | sha256sum | cut -c1-16)"
          fi
          version=""
          if [[ "$TARGET" == game ]]; then
            version="-$(uv run --no-sync python -c 'from crimson.game_version import current_replay_game_version; print(current_replay_game_version())')"
          fi
          binary=core
          if [[ "$TARGET" == wasm ]]; then binary=core.wasm; fi
          if [[ "$TARGET" == game ]]; then binary=game.wasm; fi
          echo "binary=$binary" >> "$GITHUB_OUTPUT"
          echo "key=runtime-v2-$TARGET-${{ runner.os }}-${{ runner.arch }}-$compiler-$(python3 scripts/ci_changed_paths.py hash "$SUITE")$version" >> "$GITHUB_OUTPUT"
      - name: Restore the compiled module
        id: binary
        uses: actions/cache@v4
        with:
          path: crimson-core/build/${{ inputs.target }}/${{ steps.inputs.outputs.binary }}
          key: ${{ steps.inputs.outputs.key }}
      - uses: mlugg/setup-zig@v2
        if: steps.binary.outputs.cache-hit != 'true'
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: ${{ inputs.target }}
      - name: Compile the module
        if: steps.binary.outputs.cache-hit != 'true'
        env:
          TARGET: ${{ inputs.target }}
        run: |
          uv run --no-sync python scripts/ci_benchmark.py --out crimson-core/build/timings.jsonl --name "build-$TARGET" -- \
            python crimson-core/build.py --target "$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ inputs.target }}
          path: crimson-core/build/${{ inputs.target }}/${{ steps.inputs.outputs.binary }}
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ inputs.target }}-diagnostics
          path: |
            crimson-core/build/timings.jsonl
            crimson-core/build/${{ inputs.target }}/errors.txt
            crimson-core/build/${{ inputs.target }}/link.log
