name: Crimson core

# The gate also runs the Python port, so its sources and the replay fixtures count.
on:
  push:
    branches:
      - "master"
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.detect.outputs.core }}
      gate: ${{ steps.detect.outputs.core-gate }}
      game: ${{ steps.detect.outputs.core-game }}
    steps:
      - uses: actions/checkout@v5
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base=()
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            base=(--base "$BASE_SHA")
          fi
          python3 scripts/ci_changed_paths.py changed "${base[@]}" core core-gate core-game | tee -a "$GITHUB_OUTPUT"

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.17.0"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      # The cores and the bot corpus are keyed by everything they read (scripts/ci_changed_paths.py) and the
      # toolchains. A cache is saved only when the whole job passes, so a restored corpus already passed the
      # native/WASM matrix with exactly these inputs.
      - name: Name the inputs
        id: inputs
        run: |
          toolchains="$(clang++ --version | head -1 | sha256sum | cut -c1-16)-zig$(zig version)-node$(node --version)"
          echo "cores=$toolchains-$(python3 scripts/ci_changed_paths.py hash core-build)" >> "$GITHUB_OUTPUT"
          echo "corpus=$toolchains-$(python3 scripts/ci_changed_paths.py hash core-corpus)" >> "$GITHUB_OUTPUT"

      - name: Restore native and WASM cores
        id: cores
        uses: actions/cache@v4
        with:
          path: |
            crimson-core/build/native/core
            crimson-core/build/wasm/core.wasm
          key: cores-${{ runner.os }}-${{ steps.inputs.outputs.cores }}

      - name: Build native and WASM cores
        if: steps.cores.outputs.cache-hit != 'true'
        run: |
          uv run --no-sync python crimson-core/build.py
          uv run --no-sync python crimson-core/build.py --target wasm

      - name: Restore the bot corpus
        id: corpus
        uses: actions/cache@v4
        with:
          path: |
            crimson-core/build/fixtures
            crimson-core/build/report.json
          key: corpus-${{ runner.os }}-${{ steps.inputs.outputs.corpus }}

      - name: Compare all modes and resets
        if: steps.corpus.outputs.cache-hit != 'true'
        env:
          CRIMSON_CORE_TRACE_INIT: "1"
        run: node crimson-core/checks/matrix.mjs

      - name: Compare whole runs with Python under the original rules
        if: needs.changes.outputs.gate == 'true'
        run: uv run --no-sync python crimson-core/checks/gate.py

      - name: Build the game module
        if: needs.changes.outputs.game == 'true'
        run: uv run --no-sync python crimson-core/build.py --target game
      # Each check boots the original from a fresh copy of the files crimson.land
      # serves, since the game writes its profile into its directory. The session
      # check plays a seed whose run picks perks and pauses; some runs end sooner.
      # The ranked runs (a Survival run and quest 1.1) must queue the replay the
      # leaderboard takes, and the module reads every recorded fixture it can play
      # and watches each to the result it recorded, and the high score screen shows
      # the leaderboard's runs and watches them.
      - name: Run the game module inside the original with its files
        if: needs.changes.outputs.game == 'true'
        run: |
          uv run --no-sync python crimson-core/checks/game_files.py "$RUNNER_TEMP/game"
          fresh() { rm -rf "$RUNNER_TEMP/run" && cp -R "$RUNNER_TEMP/game" "$RUNNER_TEMP/run" && echo "$RUNNER_TEMP/run"; }
          node crimson-core/checks/game_boot.mjs "$(fresh)"
          node crimson-core/checks/game_session.mjs --seed 4069574050 "$(fresh)"
          node crimson-core/checks/game_session.mjs --ranked --seed 4069574050 "$(fresh)"
          node crimson-core/checks/game_session.mjs --ranked --quest --seed 1 "$(fresh)"
          node crimson-core/checks/game_replay_read.mjs "$(fresh)"
          node crimson-core/checks/game_watch.mjs "$(fresh)"
          node crimson-core/checks/game_seek.mjs "$(fresh)"
          node crimson-core/checks/game_online.mjs "$(fresh)"
          uv run --no-sync python crimson-core/checks/game_check.py --live "$(fresh)"

      - name: Download original executable
        run: |
          game_dir="game_bins/crimsonland/1.9.93-gog"
          mkdir -p "$game_dir"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$game_dir/crimsonland.exe" \
            "https://paq.crimson.banteg.xyz/v1.9.93/crimsonland.exe"
          sha256sum --check <<'EOF'
          771531fe72c36dbcb7ca8d8a391f00884ced8240fbb17080ffc3e0e59482c4f4  game_bins/crimsonland/1.9.93-gog/crimsonland.exe
          EOF

      - name: Compare all quest builders to original x86
        run: |
          uv run --no-sync python crimson-core/checks/builder_oracle.py \
            --exe game_bins/crimsonland/1.9.93-gog/crimsonland.exe \
            --out crimson-core/build/oracle.json

      - name: Compare gameplay math to original x87
        run: |
          uv run --no-sync python crimson-core/checks/math_oracle.py \
            --exe game_bins/crimsonland/1.9.93-gog/crimsonland.exe \
            --out crimson-core/build/math-oracle.json

      - name: Load the same WASM in the Python desktop host probe
        run: |
          uv run --no-sync --with wasmtime==49.0.0 python crimson-core/checks/wasmtime_check.py \
            --out crimson-core/build/wasmtime.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crimson-core-results
          path: |
            crimson-core/build/report.json
            crimson-core/build/gate.json
            crimson-core/build/oracle.json
            crimson-core/build/math-oracle.json
            crimson-core/build/wasmtime.json
            crimson-core/build/*/errors.txt
            crimson-core/build/*/link.log
            crimson-core/build/native/core
            crimson-core/build/wasm/core.wasm

  gate:
    name: core-gate
    needs: [changes, core]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require core when relevant
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.core }}
          CORE_RESULT: ${{ needs.core.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [[ "$RELEVANT" == true ]]; then
            test "$CORE_RESULT" = success
          else
            test "$RELEVANT" = false
            test "$CORE_RESULT" = skipped
          fi
