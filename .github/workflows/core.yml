name: Crimson core

# The gate also runs the Python port, so its sources and the replay fixtures count.
on:
  push:
    branches:
      - "master"
    paths:
      - "crimson-core/**"
      - "decomp/**"
      - "third_party/headers/**"
      - "tools/match/include/**"
      - "tools/native/data_definitions/**"
      - "src/**"
      - "crimson-re/**"
      - "tests/fixtures/replays/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/core.yml"
  pull_request:
    paths:
      - "crimson-core/**"
      - "decomp/**"
      - "third_party/headers/**"
      - "tools/match/include/**"
      - "tools/native/data_definitions/**"
      - "src/**"
      - "crimson-re/**"
      - "tests/fixtures/replays/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/core.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.17.0"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Build native and WASM cores
        run: |
          uv run --no-sync python crimson-core/build.py
          uv run --no-sync python crimson-core/build.py --target wasm

      - name: Compare all modes and resets
        env:
          CRIMSON_CORE_TRACE_INIT: "1"
        run: node crimson-core/checks/matrix.mjs

      - name: Compare whole runs with Python under the original rules
        run: uv run --no-sync python crimson-core/checks/gate.py

      - name: Compare the game module with the verifier on every gate stream
        run: |
          uv run --no-sync python crimson-core/build.py --target game
          uv run --no-sync python crimson-core/checks/game_check.py

      # Each check boots the original from a fresh copy of the files crimson.land
      # serves, since the game writes its profile into its directory. The session
      # check plays a seed whose run picks perks and pauses; some runs end sooner.
      - name: Run the game module inside the original with its files
        run: |
          uv run --no-sync python crimson-core/checks/game_files.py "$RUNNER_TEMP/game"
          fresh() { rm -rf "$RUNNER_TEMP/run" && cp -R "$RUNNER_TEMP/game" "$RUNNER_TEMP/run" && echo "$RUNNER_TEMP/run"; }
          node crimson-core/checks/game_boot.mjs "$(fresh)"
          node crimson-core/checks/game_session.mjs --seed 4069574050 "$(fresh)"
          uv run --no-sync python crimson-core/checks/game_check.py --live "$(fresh)"

      - name: Download original executable
        run: |
          game_dir="game_bins/crimsonland/1.9.93-gog"
          mkdir -p "$game_dir"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$game_dir/crimsonland.exe" \
            "https://paq.crimson.banteg.xyz/v1.9.93/crimsonland.exe"
          sha256sum --check <<'EOF'
          771531fe72c36dbcb7ca8d8a391f00884ced8240fbb17080ffc3e0e59482c4f4  game_bins/crimsonland/1.9.93-gog/crimsonland.exe
          EOF

      - name: Compare all quest builders to original x86
        run: |
          uv run --no-sync python crimson-core/checks/builder_oracle.py \
            --exe game_bins/crimsonland/1.9.93-gog/crimsonland.exe \
            --out crimson-core/build/oracle.json

      - name: Compare gameplay math to original x87
        run: |
          uv run --no-sync python crimson-core/checks/math_oracle.py \
            --exe game_bins/crimsonland/1.9.93-gog/crimsonland.exe \
            --out crimson-core/build/math-oracle.json

      - name: Load the same WASM in the Python desktop host probe
        run: |
          uv run --no-sync --with wasmtime==49.0.0 python crimson-core/checks/wasmtime_check.py \
            --out crimson-core/build/wasmtime.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crimson-core-results
          path: |
            crimson-core/build/report.json
            crimson-core/build/gate.json
            crimson-core/build/oracle.json
            crimson-core/build/math-oracle.json
            crimson-core/build/wasmtime.json
            crimson-core/build/*/errors.txt
            crimson-core/build/*/link.log
            crimson-core/build/native/core
            crimson-core/build/wasm/core.wasm
