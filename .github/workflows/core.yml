name: Crimson runtime

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.detect.outputs.release }}
      core: ${{ steps.detect.outputs.core }}
      python: ${{ steps.detect.outputs.core-gate }}
      game: ${{ steps.detect.outputs.core-game }}
      oracles: ${{ steps.detect.outputs.core-oracles }}
      corpus: ${{ steps.detect.outputs.corpus }}
      client: ${{ steps.detect.outputs.client }}
      service: ${{ steps.detect.outputs.service }}
    steps:
      - uses: actions/checkout@v5
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          base=()
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            base=(--base "$BASE_SHA")
          fi
          python3 scripts/ci_changed_paths.py changed "${base[@]}" core core-gate core-game core-oracles client service | tee -a "$GITHUB_OUTPUT"
          if grep -q '^core=true$' "$GITHUB_OUTPUT"; then
            echo "corpus=true" >> "$GITHUB_OUTPUT"
          else
            echo "corpus=false" >> "$GITHUB_OUTPUT"
          fi

  build-native:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/runtime-build.yml
    with:
      target: native
      suite: core-build

  build-wasm:
    needs: changes
    if: needs.changes.outputs.release == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.service == 'true'
    uses: ./.github/workflows/runtime-build.yml
    with:
      target: wasm
      suite: core-build

  build-game:
    needs: changes
    if: needs.changes.outputs.release == 'true' || needs.changes.outputs.game == 'true' || needs.changes.outputs.client == 'true'
    uses: ./.github/workflows/runtime-build.yml
    with:
      target: game
      suite: game-build

  corpus:
    needs: [changes, build-native, build-wasm]
    if: needs.changes.outputs.corpus == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Check native snapshot framing
        run: node --test crimson-core/checks/compare.test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: runtime-native
          path: crimson-core/build/native
      - run: chmod +x crimson-core/build/native/core
      - uses: actions/download-artifact@v4
        with:
          name: runtime-wasm
          path: crimson-core/build/wasm
      - name: Name the validated corpus inputs
        id: inputs
        run: |
          compiler="$(clang++ --version | sha256sum | cut -c1-16)-zig0.17.0-node$(node --version)"
          echo "key=corpus-v2-${{ runner.os }}-${{ runner.arch }}-$compiler-$(python3 scripts/ci_changed_paths.py hash core-corpus)" >> "$GITHUB_OUTPUT"
      # Exact cache hits reuse a complete corpus already validated with these sources and toolchains.
      - name: Restore the validated bot corpus
        id: corpus
        uses: actions/cache@v4
        with:
          path: |
            crimson-core/build/fixtures
            crimson-core/build/report.json
          key: ${{ steps.inputs.outputs.key }}
      - name: Compare all modes and resets
        if: steps.corpus.outputs.cache-hit != 'true'
        run: |
          uv run --no-sync python scripts/ci_benchmark.py --out crimson-core/build/timings.jsonl --name matrix -- \
            node crimson-core/checks/matrix.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-corpus
          path: |
            crimson-core/build/fixtures
            crimson-core/build/report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-corpus-timings
          path: crimson-core/build/timings.jsonl

  python:
    needs: [changes, build-native, corpus]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - uses: actions/download-artifact@v4
        with:
          name: runtime-native
          path: crimson-core/build/native
      - run: chmod +x crimson-core/build/native/core
      - uses: actions/download-artifact@v4
        with:
          name: runtime-corpus
          path: crimson-core/build
      - name: Compare complete runs with Python
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          uv run --no-sync python scripts/ci_benchmark.py --out crimson-core/build/timings.jsonl --name "python-$SHARD" -- \
            python crimson-core/checks/gate.py --shard "$SHARD/4"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-python-${{ matrix.shard }}
          path: |
            crimson-core/build/gate.json
            crimson-core/build/timings.jsonl
          if-no-files-found: error

  python-report:
    needs: [changes, corpus, python]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - uses: actions/download-artifact@v4
        with:
          name: runtime-corpus
          path: crimson-core/build
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-python-*
          path: crimson-core/build/shards
      - name: Require every stream exactly once
        run: |
          reports=()
          for report in crimson-core/build/shards/*/gate.json; do reports+=(--merge "$report"); done
          uv run --no-sync python crimson-core/checks/gate.py "${reports[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-python-report
          path: crimson-core/build/gate.json
          if-no-files-found: error

  game-smoke:
    needs: [changes, build-wasm, build-game]
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: runtime-wasm
          path: crimson-core/build/wasm
      - uses: actions/download-artifact@v4
        with:
          name: runtime-game
          path: crimson-core/build/game
      - name: Boot, play, rank, read, watch, seek, and load online scores
        run: |
          uv run --no-sync python crimson-core/checks/game_files.py "$RUNNER_TEMP/game"
          fresh() { rm -rf "$RUNNER_TEMP/run" && cp -R "$RUNNER_TEMP/game" "$RUNNER_TEMP/run" && echo "$RUNNER_TEMP/run"; }
          node crimson-core/checks/game_boot.mjs "$(fresh)"
          node crimson-core/checks/game_session.mjs --seed 4069574050 "$(fresh)"
          node crimson-core/checks/game_session.mjs --ranked --seed 4069574050 "$(fresh)"
          node crimson-core/checks/game_session.mjs --ranked --quest --seed 1 "$(fresh)"
          node crimson-core/checks/game_replay_read.mjs "$(fresh)"
          node crimson-core/checks/game_watch.mjs "$(fresh)"
          node crimson-core/checks/game_seek.mjs "$(fresh)"
          node crimson-core/checks/game_online.mjs "$(fresh)"
  game-parity:
    needs: [changes, build-wasm, build-game, corpus]
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: runtime-wasm
          path: crimson-core/build/wasm
      - uses: actions/download-artifact@v4
        with:
          name: runtime-game
          path: crimson-core/build/game
      - uses: actions/download-artifact@v4
        with:
          name: runtime-corpus
          path: crimson-core/build
      - name: Compare every game stream inside the original
        run: |
          uv run --no-sync python crimson-core/checks/game_files.py "$RUNNER_TEMP/game"
          uv run --no-sync python scripts/ci_benchmark.py --out crimson-core/build/timings.jsonl --name game-parity -- \
            python crimson-core/checks/game_check.py --live "$RUNNER_TEMP/game"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-game-parity-timings
          path: crimson-core/build/timings.jsonl

  oracles:
    needs: [changes, build-native, build-wasm, corpus]
    if: needs.changes.outputs.oracles == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: runtime-native
          path: crimson-core/build/native
      - run: chmod +x crimson-core/build/native/core
      - uses: actions/download-artifact@v4
        with:
          name: runtime-wasm
          path: crimson-core/build/wasm
      - uses: actions/download-artifact@v4
        with:
          name: runtime-corpus
          path: crimson-core/build
      - name: Download original executable
        run: |
          game_dir="game_bins/crimsonland/1.9.93-gog"
          mkdir -p "$game_dir"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$game_dir/crimsonland.exe" \
            "https://paq.crimson.banteg.xyz/v1.9.93/crimsonland.exe"
          sha256sum --check <<'EOF'
          771531fe72c36dbcb7ca8d8a391f00884ced8240fbb17080ffc3e0e59482c4f4  game_bins/crimsonland/1.9.93-gog/crimsonland.exe
          EOF

      - name: Compare all quest builders to original x86
        run: |
          uv run --no-sync python crimson-core/checks/builder_oracle.py \
            --exe game_bins/crimsonland/1.9.93-gog/crimsonland.exe \
            --out crimson-core/build/oracle.json

      - name: Compare gameplay math to original x87
        run: |
          uv run --no-sync python crimson-core/checks/math_oracle.py \
            --exe game_bins/crimsonland/1.9.93-gog/crimsonland.exe \
            --out crimson-core/build/math-oracle.json

      - name: Load the same WASM in the Python desktop host probe
        run: |
          uv run --no-sync --with wasmtime==49.0.0 python crimson-core/checks/wasmtime_check.py \
            --out crimson-core/build/wasmtime.json

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-oracles
          path: |
            crimson-core/build/oracle.json
            crimson-core/build/math-oracle.json
            crimson-core/build/wasmtime.json
          if-no-files-found: error

  client:
    needs: [changes, build-game]
    if: needs.changes.outputs.release == 'true' || needs.changes.outputs.client == 'true'
    uses: ./.github/workflows/client.yml
    with:
      desktop: ${{ needs.changes.outputs.client == 'true' }}

  service:
    needs: [changes, build-wasm]
    if: needs.changes.outputs.service == 'true'
    uses: ./.github/workflows/service.yml

  core-gate:
    name: core-gate
    needs: [changes, build-native, build-wasm, build-game, corpus, python, python-report, game-smoke, game-parity, oracles]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Require successful relevant jobs and skipped irrelevant jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_gate.py core

  client-gate:
    name: client-gate
    needs: [changes, build-game, client]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Require successful relevant jobs and skipped irrelevant jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_gate.py client

  service-gate:
    name: service-gate
    needs: [changes, build-wasm, service]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Require successful relevant jobs and skipped irrelevant jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_gate.py service
