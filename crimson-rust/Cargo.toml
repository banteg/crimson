[workspace]
members = [
  "crates/crimson-rust",
  "crates/crimson-rust-core",
  "crates/crimson-rust-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
flate2 = "1.0"
rmp-serde = "1.3"
rmpv = { version = "1.3", features = ["with-serde"] }
clap = { version = "4.5", features = ["derive"] }
wasm-bindgen = "0.2"
directories = "6.0"
