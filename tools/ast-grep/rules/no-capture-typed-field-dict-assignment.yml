id: no-capture-typed-field-dict-assignment
language: python
severity: error
message: Use typed capture builders/structs for capture fields; keep raw dict payloads only in malformed-input helpers.
files:
  - tests/test_original_capture_conversion.py
  - tests/test_original_capture_divergence_report_rng_calls.py
rule:
  any:
    - all:
        - kind: assignment
        - regex: '\.(input_player_keys|input_approx|perk_apply_in_tick)\s*=\s*\[\s*\{'
    - all:
        - kind: assignment
        - regex: '\.(perk_apply_outside_before|input_queries)\s*=\s*\{'
    - all:
        - kind: assignment
        - regex: '\.rng\s*=\s*_base_rng_summary\([^)]*head\s*=\s*\[\s*\{'
