id: no-lan-template-method-overrides
language: python
severity: error
message: LAN frame orchestration uses LanFramePolicy callbacks, not template-method overrides. Override `_lan_frame_policy()` instead.
files:
  - src/crimson/modes/**/*.py
rule:
  kind: function_definition
  any:
    - pattern: |
        def _prepare_lan_frame($$$PARAMS):
            $$$BODY
    - pattern: |
        def _allow_lan_frame_pop($$$PARAMS):
            $$$BODY
    - pattern: |
        def _on_tick_applied($$$PARAMS):
            $$$BODY
    - pattern: |
        def _on_lan_paused($$$PARAMS):
            $$$BODY
