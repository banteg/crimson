id: no-broad-exception-runtime
language: python
severity: error
message: Avoid broad `except Exception` in runtime hot paths; catch specific expected exception types.
files:
  - src/crimson/assets_fetch.py
  - src/crimson/screens/panels/databases.py
  - src/crimson/screens/panels/mods.py
  - src/crimson/screens/menu.py
  - src/crimson/screens/panels/controls.py
  - src/crimson/screens/panels/options.py
  - src/crimson/screens/panels/play_game.py
  - src/crimson/game/high_scores_view/records.py
  - src/crimson/game/quest_views/quests_menu.py
  - src/crimson/game/runtime.py
  - src/crimson/game/quest_views/shared.py
  - src/crimson/game/quest_views/quest_results.py
  - src/crimson/modes/components/highscore_record_builder.py
  - src/crimson/movement_controls.py
  - src/crimson/net/transport.py
  - src/crimson/perks/availability.py
  - src/crimson/persistence/save_status.py
  - src/crimson/views/audio_bootstrap.py
  - src/crimson/views/spawn_plan.py
  - src/crimson/weapon_runtime/assign.py
  - src/crimson/weapon_runtime/availability.py
  - src/grim/music.py
  - src/grim/sfx.py
rule:
  any:
    - pattern: |
        try:
          $$$TRY
        except Exception:
          $$$HANDLER
    - pattern: |
        try:
          $$$TRY
        except Exception as $ERR:
          $$$HANDLER
