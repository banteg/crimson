id: no-any-contract-gaps
language: python
severity: error
message: Avoid `Any` in core runtime/frontend contracts; use concrete protocol or struct types.
files:
  - src/crimson/frontend/types.py
  - src/crimson/game/mode_views.py
  - src/crimson/render/world/draw.py
  - src/crimson/sim/state_types.py
rule:
  any:
    - pattern: "$NAME: Any"
    - pattern: "$NAME: TypeAlias = Any"
    - pattern: |
        def $FUNC($$$A, $ARG: Any, $$$B):
          $$$BODY
    - pattern: |
        def $FUNC($$$A, $ARG: Any, $$$B) -> $RET:
          $$$BODY
    - pattern: |
        def $FUNC($ARG: Any):
          $$$BODY
    - pattern: |
        def $FUNC($ARG: Any) -> $RET:
          $$$BODY
