id: no-gameplay-rng-out-of-band
language: python
severity: warning
message: Do not consume deterministic gameplay RNG (`state.rng.rand`) in out-of-band presentation/init code; derive stable values from `state.rng.state` or route through the deterministic step pipeline.
files:
  - src/crimson/modes/base_gameplay_mode.py
rule:
  any:
    - pattern: $OBJ.state.rng.rand
    - pattern: $OBJ.state.rng.rand()
