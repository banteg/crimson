id: no-capture-eventhead-dict-payloads
language: python
severity: error
message: Use typed capture event-head builders instead of raw dict payloads.
files:
  - tests/test_original_capture_conversion.py
  - tests/test_original_capture_divergence_report_summary.py
  - tests/test_original_capture_divergence_report_rng_calls.py
rule:
  any:
    - all:
        - kind: assignment
        - regex: '\.event_heads\s*=\s*\[\s*\{'
    - all:
        - kind: function_definition
        - regex: 'event_heads\s*:\s*list\[dict\[str,\s*object\]\]'
