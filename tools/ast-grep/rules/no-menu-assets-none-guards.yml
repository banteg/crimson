id: no-menu-assets-none-guards
language: python
severity: warning
message: Menu view assets are required after `open()`; prefer fail-fast assertions over `None` branches.
files:
  - src/crimson/screens/menu.py
  - src/crimson/screens/pause_menu.py
  - src/crimson/screens/panels/base.py
  - src/crimson/screens/panels/credits.py
  - src/crimson/screens/panels/stats.py
  - src/crimson/screens/panels/databases.py
  - src/crimson/screens/panels/controls.py
  - src/crimson/screens/panels/alien_zookeeper.py
  - src/crimson/game/high_scores_view/view.py
  - src/crimson/game/quest_views/quests_menu.py
rule:
  any:
    - pattern: |
        if assets is None:
            $$$BODY
    - pattern: |
        if assets is not None:
            $$$BODY
    - pattern: |
        if assets is None or $COND:
            $$$BODY
    - pattern: |
        if $COND or assets is None:
            $$$BODY
    - pattern: assets.sign is None
    - pattern: assets.panel is None
    - pattern: assets.item is None
    - pattern: assets.labels is None
