id: no-net-message-getattr-fallbacks
language: python
severity: error
message: Net runtime uses typed protocol structs; avoid `getattr` fallback access on message contracts.
files:
  - src/crimson/net/runtime.py
rule:
  any:
    - pattern: getattr(message, $ATTR, $DEFAULT)
    - pattern: getattr(hello, $ATTR, $DEFAULT)
    - pattern: getattr(welcome, $ATTR, $DEFAULT)
