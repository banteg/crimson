id: no-capture-eventhead-dict-payloads
valid:
  - |
    from tests.builders.capture import build_capture_event_head_projectile_spawn

    tick.event_heads = [build_capture_event_head_projectile_spawn(owner_id=-100, requested_type_id=1, actual_type_id=1)]
  - |
    from crimson.original.schema import CaptureEventHead

    def _capture_tick(event_heads: list[CaptureEventHead]) -> None:
      tick_obj.event_heads = list(event_heads)
invalid:
  - |
    tick.event_heads = [{"type": "projectile_spawn", "data": {"owner_id": -100}}]
  - |
    def _capture_tick(event_heads: list[dict[str, object]]) -> None:
      tick_obj.event_heads = event_heads
