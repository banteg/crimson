id: no-net-message-getattr-fallbacks
snapshots:
  ? |
    mode_id = int(getattr(message, "mode_id", 0) or 0)
  : labels:
    - source: getattr(message, "mode_id", 0)
      style: primary
      start: 14
      end: 44
  ? |
    players = int(getattr(hello, "player_count", 1) or 1)
  : labels:
    - source: getattr(hello, "player_count", 1)
      style: primary
      start: 14
      end: 47
  ? |
    session_id = str(getattr(welcome, "session_id", "") or "")
  : labels:
    - source: getattr(welcome, "session_id", "")
      style: primary
      start: 17
      end: 51
